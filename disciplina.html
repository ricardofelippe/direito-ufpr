
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Área de estudos da disciplina de Direito.">
  <title>Disciplina - Estudos de Direito</title>
  <link rel="stylesheet" href="direito.css">
  <style>
    body.pagina-disciplina {
      --fundo: #070b12;
      --fundo-secundario: #0c1420;
      --superficie: #101b29;
      --superficie-hover: #172638;
      --borda: #1b3041;
      --azul: #19c7ce;
      --azul-claro: #36d9dc;
      --azul-fundo: #10343d;
      --texto: #e6edf5;
      --texto-secundario: #a5b8ca;
      --texto-suave: #71869b;
      background: var(--fundo);
      color: var(--texto);
      min-height: 100vh;
    }

    .pagina-disciplina header {
      text-align: left;
      padding: 28px 22px;
      background: linear-gradient(135deg,#0c1420,#101f2c);
      border-bottom: 1px solid var(--borda);
    }

    .cabecalho-disciplina,
    .conteudo-disciplina {
      max-width: 1240px;
      margin: 0 auto;
    }

    .navegacao-disciplina {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 15px;
    }

    .navegacao-disciplina a {
      display: inline-block;
      color: var(--azul-claro);
      text-decoration: none;
      font-size: 13px;
    }

    .navegacao-disciplina a:hover {
      text-decoration: underline;
    }

    .cabecalho-disciplina h1 {
      margin: 0;
      font-size: clamp(25px,3vw,34px);
      letter-spacing: -.4px;
    }

    .metadados-disciplina {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 10px;
      color: var(--texto-secundario);
      font-size: 13px;
    }

    .descricao-disciplina {
      max-width: 780px;
      margin: 12px 0 0;
      color: var(--texto-secundario);
    }

    .conteudo-disciplina {
      padding: 28px 22px 60px;
    }

    .topicos-disciplina {
      margin-bottom: 28px;
    }

    .topicos-disciplina h2 {
      margin: 0 0 14px;
      color: var(--texto);
      font-size: 19px;
    }

    .resumo-progresso-disciplina {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 22px;
    }

    .indicador-progresso-disciplina {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--borda);
      border-radius: 9px;
      background: var(--superficie);
      color: var(--texto-secundario);
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .indicador-progresso-disciplina:hover,
    .indicador-progresso-disciplina[aria-pressed="true"] {
      border-color: var(--azul);
      background: var(--superficie-hover);
    }

    .indicador-progresso-disciplina[aria-pressed="true"] {
      box-shadow: inset 0 0 0 1px var(--azul);
    }

    .indicador-progresso-disciplina strong {
      display: block;
      margin-bottom: 4px;
      color: var(--texto);
      font-size: 23px;
      font-variant-numeric: tabular-nums;
    }

    .indicador-progresso-disciplina span {
      font-size: 11px;
      line-height: 1.3;
    }

    .aviso-filtro-assuntos {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      color: var(--texto-secundario);
      font-size: 12px;
    }

    .limpar-filtro-assuntos {
      padding: 5px 9px;
      border: 1px solid var(--borda);
      border-radius: 6px;
      background: transparent;
      color: var(--azul-claro);
      cursor: pointer;
      font: inherit;
    }

    .cartao-topico-item[hidden] { display: none !important; }

    .lista-unidades {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unidade-disciplina {
      padding: 0;
    }

    .cabecalho-unidade {
      margin: 0 0 12px;
      padding: 0 0 10px;
      border-bottom: 1px solid var(--borda);
    }

    .cabecalho-unidade h3 {
      margin: 0;
      color: var(--texto);
      font-size: 17px;
      line-height: 1.4;
    }

    .identificador-unidade {
      display: inline-block;
      margin-right: 8px;
      color: var(--azul-claro);
      font-size: 12px;
      font-weight: 700;
    }

    .grade-topicos {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 14px;
    }

    .cartao-assunto-wrapper {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 6px;
      min-width: 0;
    }

    .indicador-ordem-assunto {
      color: var(--texto-suave);
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .5px;
      line-height: 1.2;
    }

    .cartao-assunto-wrapper[hidden] {
      display: none !important;
    }

    .cartao-topico {
      display: flex;
      flex-direction: column;
      min-height: 128px;
      padding: 17px;
      text-align: left;
      color: var(--texto);
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      transition: .18s ease;
    }

    .cartao-topico:hover,
    .cartao-topico[aria-pressed="true"] {
      border-color: var(--azul);
      background: var(--superficie-hover);
    }

    .cartao-topico[aria-pressed="true"] {
      box-shadow: inset 0 0 0 1px var(--azul);
    }

    .icone-topico {
      color: var(--azul-claro);
      font-size: 20px;
      margin-bottom: 8px;
    }

    .cartao-topico-item {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      padding: 14px;
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: 10px;
    }

    .cartao-topico-item .cartao-topico {
      width: 100%;
      min-height: 0;
      padding: 4px;
      border: 0;
      background: transparent;
    }

    .cartao-topico-item > summary.cartao-topico {
      position: relative;
      padding-right: 28px;
      list-style: none;
      cursor: pointer;
    }

    .cartao-topico-item > summary.cartao-topico::-webkit-details-marker {
      display: none;
    }

    .cartao-topico-item > summary.cartao-topico::after {
      content: "+";
      position: absolute;
      right: 5px;
      top: 3px;
      color: var(--azul-claro);
      font-size: 20px;
      font-weight: 400;
    }

    .cartao-topico-item[open] > summary.cartao-topico::after {
      content: "−";
    }

    .cartao-topico-item .controles-progresso > [data-assunto] {
      justify-self: start;
    }

    .controles-progresso {
      display: grid;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--borda);
    }

    .campo-progresso {
      display: grid;
      gap: 4px;
      color: var(--texto-secundario);
      font-size: 11px;
    }

    .historico-estudos {
      padding: 10px 12px;
      background: var(--fundo-secundario);
      border: 1px solid var(--borda);
      border-radius: 7px;
      color: var(--texto-secundario);
      font-size: 12px;
    }

    .historico-estudos strong { color: var(--texto); }
    .lista-historico-estudos {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin: 7px 0 0;
      padding-left: 18px;
    }

    .item-historico-estudo { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:5px; }
    .acao-historico { padding:3px 7px; border:1px solid var(--borda); border-radius:5px; background:transparent; color:var(--azul-claro); cursor:pointer; font:inherit; font-size:10px; }
    .acao-historico.excluir { color:#fca5a5; }

    .campo-progresso select {
      width: 100%;
      min-width: 0;
      padding: 8px;
      color: var(--texto);
      background: var(--fundo-secundario);
      border: 1px solid var(--borda);
      border-radius: 6px;
      font: inherit;
      font-size: 12px;
    }

    .botao-salvar-progresso {
      padding: 9px 12px;
      color: #061318;
      background: var(--azul-claro);
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font: 700 12px Arial,sans-serif;
    }

    .botao-salvar-progresso:hover {
      filter: brightness(1.08);
    }

    .mensagem-progresso {
      min-height: 14px;
      color: var(--texto-suave);
      font-size: 11px;
      line-height: 1.4;
    }

    /* Destaque visual conforme a situação geral do assunto */
    .cartao-topico-item.status-em-andamento { border-color:#22d3ee; background:linear-gradient(145deg,rgba(34,211,238,.10),var(--superficie) 62%); box-shadow:inset 3px 0 0 #22d3ee; }
    .cartao-topico-item.status-concluido { border-color:#22c55e; background:linear-gradient(145deg,rgba(34,197,94,.09),var(--superficie) 62%); box-shadow:inset 3px 0 0 #22c55e; }
    .cartao-topico-item.status-pendente { border-color:#f59e0b; background:linear-gradient(145deg,rgba(245,158,11,.09),var(--superficie) 62%); box-shadow:inset 3px 0 0 #f59e0b; }
    .indicador-situacao { display:inline-flex; align-items:center; align-self:flex-start; gap:6px; margin-top:8px; padding:4px 8px; border-radius:999px; font-size:10px; font-weight:700; background:rgba(148,163,184,.12); color:var(--texto-secundario); }
    .status-em-andamento .indicador-situacao { color:#67e8f9; background:rgba(34,211,238,.13); }
    .status-concluido .indicador-situacao { color:#86efac; background:rgba(34,197,94,.13); }
    .status-pendente .indicador-situacao { color:#fcd34d; background:rgba(245,158,11,.13); }
    .nome-topico {
      font-weight: 700;
      font-size: 14px;
    }

    .descricao-topico {
      margin-top: 5px;
      color: var(--texto-secundario);
      font-size: 12px;
    }

    .navegacao-abas {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 0 10px;
      border-bottom: 1px solid var(--borda);
    }

    .aba-disciplina {
      flex: 0 0 auto;
      padding: 10px 14px;
      color: var(--texto-secundario);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font: 600 13px Arial,sans-serif;
    }

    .aba-disciplina:hover {
      color: var(--texto);
      background: var(--superficie);
    }

    .aba-disciplina[aria-selected="true"] {
      color: var(--azul-claro);
      background: var(--azul-fundo);
      border-color: #28515a;
    }

    .painel-aba {
      padding-top: 22px;
    }

    .estado-disciplina {
      padding: 22px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      background: var(--superficie);
      color: var(--texto-secundario);
    }

    .estado-disciplina h3 {
      margin: 0 0 7px;
      color: var(--texto);
      font-size: 16px;
    }

    .estado-disciplina p {
      margin: 0;
      font-size: 13px;
    }

    .lista-conteudos {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 14px;
    }

    .item-conteudo {
      padding: 18px;
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: 10px;
    }

    .item-conteudo h3 {
      margin: 0 0 8px;
      color: var(--azul-claro);
      font-size: 16px;
    }

    .item-conteudo p {
      margin: 6px 0;
      color: var(--texto-secundario);
      font-size: 13px;
    }

    .item-conteudo details {
      margin-top: 12px;
    }

    .item-conteudo summary {
      color: var(--azul-claro);
      cursor: pointer;
      font-size: 13px;
    }

    /* Metadados das revisões de literatura */
    .metadados-revisao {
      margin: 12px 0;
      padding: 10px 12px;
      background: var(--fundo-secundario);
      border: 1px solid var(--borda);
      border-radius: 7px;
    }

    .metadados-revisao p {
      margin: 4px 0;
      color: var(--texto-secundario);
      font-size: 12px;
      line-height: 1.5;
    }

    .metadados-revisao strong {
      color: var(--texto);
    }

    /* Texto principal da revisão */
    .texto-revisao {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--borda);
      color: var(--texto-secundario);
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    /* Conteúdos convertidos de Markdown para HTML */
    .texto-markdown {
      color: var(--texto-secundario);
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .texto-markdown > :first-child { margin-top: 0; }
    .texto-markdown > :last-child { margin-bottom: 0; }
    .texto-markdown h1,
    .texto-markdown h2,
    .texto-markdown h3,
    .texto-markdown h4 {
      color: var(--texto);
      line-height: 1.4;
      margin: 18px 0 8px;
    }
    .texto-markdown h1 { font-size: 21px; }
    .texto-markdown h2 { font-size: 18px; }
    .texto-markdown h3 { font-size: 16px; }
    .texto-markdown h4 { font-size: 14px; }
    .texto-markdown p { margin: 8px 0; }
    .texto-markdown ul,
    .texto-markdown ol {
      margin: 8px 0;
      padding-left: 24px;
    }
    .texto-markdown li { margin: 4px 0; }
    .texto-markdown strong { color: var(--texto); }
    .texto-markdown a { color: var(--azul-claro); }
    .texto-markdown blockquote {
      margin: 12px 0;
      padding: 8px 12px;
      border-left: 3px solid var(--azul);
      background: var(--fundo-secundario);
    }
    .texto-markdown code {
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--fundo-secundario);
    }
    .texto-markdown hr {
      border: 0;
      border-top: 1px solid var(--borda);
      margin: 16px 0;
    }

    .material-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--azul-claro);
      overflow-wrap: anywhere;
    }

    .aviso-filtro {
      margin: 0 0 14px;
      color: var(--texto-suave);
      font-size: 12px;
    }

    .carregando {
      color: var(--texto-secundario);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--azul-claro);
      outline-offset: 3px;
    }

    @media(max-width:850px) {
      .grade-topicos { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .resumo-progresso-disciplina { grid-template-columns: repeat(3,minmax(0,1fr)); }
    }

    @media(max-width:600px) {
      .grade-topicos,
      .lista-conteudos { grid-template-columns: 1fr; }
      .resumo-progresso-disciplina { grid-template-columns: repeat(2,minmax(0,1fr)); }

      .pagina-disciplina header {
        padding: 22px 16px;
      }

      .conteudo-disciplina {
        padding: 22px 16px 45px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>

<body class="pagina-disciplina">
  <header>
    <div class="cabecalho-disciplina">
      <nav class="navegacao-disciplina" aria-label="Navegação principal">
        <a href="index.html">⌂ Painel inicial</a>
        <a href="direito.html">← Voltar ao currículo</a>
      </nav>
      <h1 id="nome-disciplina">Carregando disciplina...</h1>
      <div class="metadados-disciplina" id="metadados-disciplina"></div>
      <p class="descricao-disciplina" id="descricao-disciplina"></p>
    </div>
  </header>

  <main class="conteudo-disciplina">
    <section class="topicos-disciplina" aria-labelledby="titulo-topicos">
      <h2 id="titulo-topicos">Assuntos da disciplina</h2>
      <div id="resumo-progresso-disciplina" class="resumo-progresso-disciplina" aria-label="Resumo do progresso da disciplina"></div>
      <div id="aviso-filtro-assuntos" class="aviso-filtro-assuntos" hidden aria-live="polite"></div>
      <div id="lista-topicos" class="grade-topicos">
        <p class="carregando">Carregando assuntos...</p>
      </div>
    </section>

    <nav class="navegacao-abas" aria-label="Seções da disciplina" role="tablist">
      <button class="aba-disciplina" id="aba-resumos" role="tab" aria-selected="true" aria-controls="painel-disciplina" data-aba="resumos">Resumos</button>
      <button class="aba-disciplina" id="aba-revisoes" role="tab" aria-selected="false" aria-controls="painel-disciplina" data-aba="revisoes">Revisões de literatura</button>
      <button class="aba-disciplina" id="aba-questoes" role="tab" aria-selected="false" aria-controls="painel-disciplina" data-aba="questoes">Questões</button>
      <button class="aba-disciplina" id="aba-flashcards" role="tab" aria-selected="false" aria-controls="painel-disciplina" data-aba="flashcards">Flashcards</button>
      <button class="aba-disciplina" id="aba-fluxogramas" role="tab" aria-selected="false" aria-controls="painel-disciplina" data-aba="fluxogramas">Fluxogramas</button>
      <button class="aba-disciplina" id="aba-materiais" role="tab" aria-selected="false" aria-controls="painel-disciplina" data-aba="materiais">Materiais</button>
    </nav>

    <section id="painel-disciplina" class="painel-aba" role="tabpanel" aria-labelledby="aba-resumos" tabindex="0">
      <p class="carregando">Preparando conteúdo...</p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const disciplinaId = params.get('id');
      const assuntoIdSolicitado = params.get('assunto');
      const painel = document.getElementById('painel-disciplina');
      const listaTopicos = document.getElementById('lista-topicos');
      const nomeEl = document.getElementById('nome-disciplina');
      const metaEl = document.getElementById('metadados-disciplina');
      const descricaoEl = document.getElementById('descricao-disciplina');

      let disciplinaAtual = null;
      let estrutura = null;
      let conteudos = null;
      let progresso = { progresso: [] };
      let documentos = [];
      let assuntoSelecionado = null;
      let filtroSituacaoAssuntos = 'todos';
      let abaAtual = 'resumos';

      const escapeHTML = (valor) =>
        String(valor ?? '').replace(/[&<>"']/g, caractere => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[caractere]));

      function renderizarMarkdown(texto) {
        const textoSeguro = String(texto ?? '');

        // Se as bibliotecas não carregarem, exibe o texto com segurança.
        if (!window.marked || !window.DOMPurify) {
          return escapeHTML(textoSeguro).replace(/\r?\n/g, '<br>');
        }

        const html = window.marked.parse(textoSeguro, {
          gfm: true,
          breaks: false
        });

        return window.DOMPurify.sanitize(html, {
          USE_PROFILES: { html: true }
        });
      }

      const ordenar = (a,b) =>
        (Number(a.ordem) || 0) - (Number(b.ordem) || 0);

      const textoRegistro = (item, chaves) => {
        for (const chave of chaves) {
          if (item && item[chave] != null && item[chave] !== '') {
            return item[chave];
          }
        }
        return '';
      };

      function mostrarEstado(container, titulo, mensagem) {
        container.innerHTML = `
          <div class="estado-disciplina">
            <h3>${escapeHTML(titulo)}</h3>
            <p>${escapeHTML(mensagem)}</p>
          </div>`;
      }

      function mostrarErro(mensagem) {
        nomeEl.textContent = 'Não foi possível abrir a disciplina';
        metaEl.textContent = '';
        listaTopicos.innerHTML = '';

        mostrarEstado(painel, 'Falha no carregamento', mensagem);

        const botao = document.createElement('button');
        botao.className = 'aba-disciplina';
        botao.textContent = 'Tentar novamente';
        botao.addEventListener('click', iniciar);
        painel.appendChild(botao);
      }

      async function carregarJSON(caminho) {
        const resposta = await fetch(caminho, { cache: 'no-store' });

        if (!resposta.ok) {
          throw new Error(`Não foi possível carregar ${caminho} (HTTP ${resposta.status}).`);
        }

        return resposta.json();
      }

      function montarCabecalho() {
        nomeEl.textContent = disciplinaAtual.nome;

        const partes = [];

        if (disciplinaAtual.codigo) partes.push(`Código: ${disciplinaAtual.codigo}`);
        if (disciplinaAtual.ano) partes.push(`${disciplinaAtual.ano}º ano`);
        if (disciplinaAtual.status) partes.push(`Situação: ${disciplinaAtual.status}`);

        metaEl.textContent = partes.join('  •  ');

        descricaoEl.textContent = disciplinaAtual.descricao ||
          'Organize aqui os conteúdos, materiais e atividades desta disciplina.';

        document.title = `${disciplinaAtual.nome} - Estudos de Direito`;
      }

      const opcoesProgresso = {
        situacao_geral: [
          ['nao_iniciado', 'Não iniciado'],
          ['em_andamento', 'Em andamento'],
          ['concluido', 'Concluído'],
          ['pendente', 'Pendente']
        ],
        conteudo_status: [
          ['nao_iniciado', 'Não iniciado'],
          ['em_andamento', 'Em andamento'],
          ['estudado', 'Estudado']
        ],
        questoes_status: [
          ['nao_iniciado', 'Não iniciado'],
          ['em_andamento', 'Em andamento'],
          ['concluido', 'Concluído'],
          ['nao_se_aplica', 'Não se aplica']
        ],
        revisao_status: [
          ['nao_iniciado', 'Não iniciado'],
          ['em_andamento', 'Em andamento'],
          ['concluido', 'Concluído'],
          ['nao_se_aplica', 'Não se aplica']
        ]
      };

      const rotulosProgresso = {
        situacao_geral: 'Situação geral',
        conteudo_status: 'Conteúdo estudado',
        questoes_status: 'Questões praticadas',
        revisao_status: 'Revisões realizadas'
      };

      function registroProgresso(assuntoId) {
        return (progresso.progresso || []).find(item => item.assunto_id === assuntoId) || {
          assunto_id: assuntoId,
          situacao_geral: 'nao_iniciado',
          conteudo_status: 'nao_iniciado',
          questoes_status: 'nao_iniciado',
          revisao_status: 'nao_iniciado'
        };
      }

      function montarCartaoAssunto(assunto, indice) {
        const titulo = textoRegistro(assunto, ['nome','titulo']) || `Assunto ${indice + 1}`;
        const descricao = textoRegistro(assunto, ['descricao','ementa']) ||
          'Selecione para filtrar os conteúdos deste assunto.';
        const registro = registroProgresso(assunto.id);

        const campos = Object.entries(opcoesProgresso).map(([campo, opcoes]) => `
          <label class="campo-progresso">
            <span>${rotulosProgresso[campo]}</span>
            <select data-progresso-campo="${campo}" aria-label="${rotulosProgresso[campo]} — ${escapeHTML(titulo)}">
              ${opcoes.map(([valor, rotulo]) => `
                <option value="${valor}" ${registro[campo] === valor ? 'selected' : ''}>${rotulo}</option>
              `).join('')}
            </select>
          </label>
        `).join('');

        const situacao = registro.situacao_geral || 'nao_iniciado';
        const classesSituacao = ['em_andamento','concluido','pendente'].includes(situacao) ? ` status-${situacao.replace('_','-')}` : '';
        const rotuloSituacao = (opcoesProgresso.situacao_geral.find(opcao => opcao[0] === situacao) || [null,'Não iniciado'])[1];
        const iconeSituacao = situacao === 'concluido' ? '✓' : situacao === 'pendente' ? '!' : situacao === 'em_andamento' ? '●' : '○';

        const indicador = indicadoresOrdemAssuntos.get(assunto.id);
        const numeracao = indicador
          ? `<span class="indicador-ordem-assunto" aria-label="${escapeHTML(indicador.ariaLabel)}">${escapeHTML(indicador.texto)}</span>`
          : '';

        return `
          <div class="cartao-assunto-wrapper">
            ${numeracao}
            <details class="cartao-topico-item${classesSituacao}" data-cartao-assunto="${escapeHTML(assunto.id)}">
            <summary class="cartao-topico">
              <span class="icone-topico">§</span>
              <span class="nome-topico">${escapeHTML(titulo)}</span>
              <span class="descricao-topico">${escapeHTML(descricao)}</span>
              <span class="indicador-situacao" data-indicador-situacao>${iconeSituacao} ${escapeHTML(rotuloSituacao)}</span>
            </summary>
            <div class="controles-progresso" aria-label="Progresso e planejamento do assunto">
              <button class="limpar-filtro-assuntos" type="button"
                data-assunto="${escapeHTML(assunto.id)}" aria-pressed="false">
                Filtrar conteúdos deste assunto
              </button>
              ${campos}
              <div class="historico-estudos">
                <strong>Histórico de estudos</strong>
                <ul class="lista-historico-estudos">
                  ${(registro.historico_estudos || (registro.data_estudo ? [{ data: registro.data_estudo }] : []))
                    .slice()
                    .sort((a, b) => b.data.localeCompare(a.data))
                    .map(sessao => `<li class="item-historico-estudo">
                      <span>${escapeHTML(sessao.data.split('-').reverse().join('/'))}</span>
                      <button type="button" class="acao-historico" data-editar-sessao="${escapeHTML(sessao.data)}">Editar</button>
                      <button type="button" class="acao-historico excluir" data-excluir-sessao="${escapeHTML(sessao.data)}">Excluir</button>
                    </li>`)
                    .join('') || '<li>Nenhuma sessão registrada.</li>'}
                </ul>
              </div>
              <label class="campo-progresso">
                <span>Registrar nova sessão de estudo</span>
                <input type="date" data-planejamento-campo="nova_sessao_estudo" value="">
              </label>
              <div class="historico-estudos">
                <strong>Histórico de revisões realizadas</strong>
                <ul class="lista-historico-estudos">
                  ${(registro.historico_revisoes || []).slice().sort((a,b) => b.data.localeCompare(a.data))
                    .map(sessao => `<li class="item-historico-estudo">
                      <span>${escapeHTML(sessao.data.split('-').reverse().join('/'))}</span>
                      <button type="button" class="acao-historico" data-editar-revisao="${escapeHTML(sessao.data)}">Editar</button>
                      <button type="button" class="acao-historico excluir" data-excluir-revisao="${escapeHTML(sessao.data)}">Excluir</button>
                    </li>`).join('') || '<li>Nenhuma revisão registrada.</li>'}
                </ul>
              </div>
              <label class="campo-progresso">
                <span>Registrar revisão realizada</span>
                <input type="date" data-planejamento-campo="nova_sessao_revisao" value="">
              </label>
              <label class="campo-progresso">
                <span>Próxima revisão programada</span>
                <input type="date" data-planejamento-campo="data_revisao" value="${escapeHTML(registro.data_revisao || '')}">
              </label>
              <button class="botao-salvar-progresso" type="button" data-salvar-progresso="${escapeHTML(assunto.id)}">
                Salvar progresso
              </button>
              <span class="mensagem-progresso" aria-live="polite"></span>
            </div>
            </details>
          </div>`;
      }

      function abrirSolicitacaoHistorico(assuntoId, acao, dataAnterior = '', novaData = '', tipo = 'estudos') {
        const cartao = listaTopicos.querySelector(`[data-cartao-assunto="${CSS.escape(assuntoId)}"]`);
        if (!cartao) return;
        if (acao === 'excluir' && !window.confirm('Confirma a exclusão deste registro do histórico?')) return;
        const valores = {};
        cartao.querySelectorAll('[data-progresso-campo]').forEach(campo => valores[campo.dataset.progressoCampo] = campo.value);
        const corpo = [
          '### ID do assunto', assuntoId, '',
          '### Situação geral', valores.situacao_geral, '',
          '### Conteúdo estudado', valores.conteudo_status, '',
          '### Questões praticadas', valores.questoes_status, '',
          '### Revisões realizadas', valores.revisao_status, '',
          '### Tipo de histórico', tipo, '',
          '### Ação no histórico', acao, '',
          '### Data registrada', dataAnterior, '',
          '### Nova sessão de estudo', tipo === 'estudos' ? (novaData || cartao.querySelector('[data-planejamento-campo="nova_sessao_estudo"]').value) : cartao.querySelector('[data-planejamento-campo="nova_sessao_estudo"]').value, '',
          '### Nova sessão de revisão', tipo === 'revisoes' ? (novaData || cartao.querySelector('[data-planejamento-campo="nova_sessao_revisao"]').value) : cartao.querySelector('[data-planejamento-campo="nova_sessao_revisao"]').value, '',
          '### Data de revisão', cartao.querySelector('[data-planejamento-campo="data_revisao"]').value
        ].join('\n');
        const parametros = new URLSearchParams({ template:'atualizar-progresso.md', title:'[Atualizar progresso] '+assuntoId, body:corpo });
        cartao.querySelector('.mensagem-progresso').textContent = 'Confira a operação e envie a solicitação no GitHub para confirmar a alteração.';
        window.open('https://github.com/ricardofelippe/direito-ufpr/issues/new?'+parametros.toString(), '_blank', 'noopener');
      }

      function abrirFormularioProgresso(assuntoId) {
        abrirSolicitacaoHistorico(assuntoId, 'adicionar');
      }

      function montarResumoProgresso() {
        const assuntos = (estrutura.assuntos || []).filter(assunto => {
          if (assunto.disciplina_id === disciplinaId) return true;
          if (assunto.unidade_id == null) return false;
          const unidade = (estrutura.unidades || []).find(item => item.id === assunto.unidade_id);
          return unidade && unidade.disciplina_id === disciplinaId;
        });
        const contagens = { todos: assuntos.length, nao_iniciado: 0, em_andamento: 0, concluido: 0, pendente: 0 };
        assuntos.forEach(assunto => {
          const situacao = registroProgresso(assunto.id).situacao_geral || 'nao_iniciado';
          if (Object.prototype.hasOwnProperty.call(contagens, situacao)) contagens[situacao]++;
          else contagens.nao_iniciado++;
        });
        const indicadores = [
          ['todos', 'Total de assuntos'], ['nao_iniciado', 'Não iniciados'],
          ['em_andamento', 'Em andamento'], ['concluido', 'Concluídos'], ['pendente', 'Pendentes']
        ];
        const resumo = document.getElementById('resumo-progresso-disciplina');
        resumo.replaceChildren();
        indicadores.forEach(([chave, rotulo]) => {
          const botao = document.createElement('button');
          botao.type = 'button';
          botao.className = 'indicador-progresso-disciplina';
          botao.dataset.filtroSituacao = chave;
          botao.setAttribute('aria-pressed', String(filtroSituacaoAssuntos === chave));
          const numero = document.createElement('strong');
          numero.textContent = String(contagens[chave]);
          const texto = document.createElement('span');
          texto.textContent = rotulo;
          botao.append(numero, texto);
          botao.addEventListener('click', () => {
            filtroSituacaoAssuntos = chave;
            aplicarFiltroSituacaoAssuntos();
          });
          resumo.appendChild(botao);
        });
      }

      function aplicarFiltroSituacaoAssuntos() {
        document.querySelectorAll('[data-cartao-assunto]').forEach(cartao => {
          const situacao = registroProgresso(cartao.dataset.cartaoAssunto).situacao_geral || 'nao_iniciado';
          const ocultar = filtroSituacaoAssuntos !== 'todos' && situacao !== filtroSituacaoAssuntos;
          cartao.hidden = ocultar;
          const wrapper = cartao.closest('.cartao-assunto-wrapper');
          if (wrapper) wrapper.hidden = ocultar;
        });
        document.querySelectorAll('[data-filtro-situacao]').forEach(botao => {
          botao.setAttribute('aria-pressed', String(botao.dataset.filtroSituacao === filtroSituacaoAssuntos));
        });
        const aviso = document.getElementById('aviso-filtro-assuntos');
        aviso.replaceChildren();
        if (filtroSituacaoAssuntos === 'todos') {
          aviso.hidden = true;
          return;
        }
        const rotulos = { nao_iniciado: 'Não iniciados', em_andamento: 'Em andamento', concluido: 'Concluídos', pendente: 'Pendentes' };
        aviso.hidden = false;
        aviso.appendChild(document.createTextNode('Exibindo somente assuntos: ' + rotulos[filtroSituacaoAssuntos] + '. '));
        const limpar = document.createElement('button');
        limpar.type = 'button';
        limpar.className = 'limpar-filtro-assuntos';
        limpar.textContent = 'Limpar filtro';
        limpar.addEventListener('click', () => {
          filtroSituacaoAssuntos = 'todos';
          aplicarFiltroSituacaoAssuntos();
        });
        aviso.appendChild(limpar);
      }

      let indicadoresOrdemAssuntos = new Map();

      function montarTopicos() {
        montarResumoProgresso();
        const unidades = (estrutura.unidades || [])
          .filter(unidade => unidade.disciplina_id === disciplinaId)
          .sort(ordenar);

        const todosAssuntos = estrutura.assuntos || [];

        // Numeração sequencial dos assuntos na ordem das unidades e dos assuntos,
        // calculada antes de qualquer filtro para permanecer estável.
        const assuntosOrdenados = unidades.flatMap(unidade =>
          todosAssuntos
            .filter(assunto => assunto.unidade_id === unidade.id)
            .sort(ordenar)
        );
        const assuntosDiretosOrdenados = todosAssuntos
          .filter(assunto => assunto.disciplina_id === disciplinaId && assunto.unidade_id == null)
          .sort(ordenar);
        assuntosOrdenados.push(...assuntosDiretosOrdenados);
        indicadoresOrdemAssuntos = new Map(assuntosOrdenados.map((assunto, indice) => {
          const numero = String(indice + 1).padStart(2, '0');
          const total = String(assuntosOrdenados.length).padStart(2, '0');
          return [assunto.id, {
            texto: numero + '/' + total,
            ariaLabel: 'Assunto ' + (indice + 1) + ' de ' + assuntosOrdenados.length + ' nesta disciplina'
          }];
        }));

        const assuntosDiretos = todosAssuntos
          .filter(assunto =>
            assunto.disciplina_id === disciplinaId &&
            assunto.unidade_id == null
          )
          .sort(ordenar);

        if (!unidades.length && !assuntosDiretos.length) {
          mostrarEstado(
            listaTopicos,
            'Assuntos ainda não cadastrados',
            'Quando as unidades e os assuntos desta disciplina forem incluídos em estrutura.json, eles aparecerão aqui.'
          );
          return;
        }

        const grupos = unidades.map((unidade, indice) => ({
          unidade,
          assuntos: todosAssuntos
            .filter(assunto => assunto.unidade_id === unidade.id)
            .sort(ordenar),
          indice
        }));

        listaTopicos.className = 'lista-unidades';

        const htmlUnidades = grupos.map(({ unidade, assuntos, indice }) => `
          <section class="unidade-disciplina" aria-labelledby="titulo-${escapeHTML(unidade.id)}">
            <div class="cabecalho-unidade">
              <h3 id="titulo-${escapeHTML(unidade.id)}">
                <span class="identificador-unidade">UNIDADE ${indice + 1}</span>
                ${escapeHTML(unidade.nome || unidade.titulo || `Unidade ${indice + 1}`)}
              </h3>
            </div>

            ${assuntos.length ? `
              <div class="grade-topicos">
                ${assuntos.map((assunto, assuntoIndice) => {
                  const titulo = textoRegistro(assunto, ['nome','titulo']) ||
                    `Assunto ${assuntoIndice + 1}`;

                  const descricao = textoRegistro(assunto, ['descricao','ementa']) ||
                    'Selecione para filtrar os conteúdos deste assunto.';

                  return montarCartaoAssunto(assunto, assuntoIndice);
                }).join('')}
              </div>
            ` : '<p class="carregando">Nenhum assunto cadastrado nesta unidade.</p>'}
          </section>
        `).join('');

        const htmlAssuntosDiretos = assuntosDiretos.length ? `
          <section class="unidade-disciplina" aria-labelledby="titulo-assuntos-diretos">
            <div class="cabecalho-unidade">
              <h3 id="titulo-assuntos-diretos">
                Assuntos diretamente vinculados à disciplina
              </h3>
            </div>

            <div class="grade-topicos">
              ${assuntosDiretos.map((assunto, indice) => {
                const titulo = textoRegistro(assunto, ['nome','titulo']) ||
                  `Assunto ${indice + 1}`;

                const descricao = textoRegistro(assunto, ['descricao','ementa']) ||
                  'Selecione para filtrar os conteúdos deste assunto.';

                return montarCartaoAssunto(assunto, indice);
              }).join('')}
            </div>
          </section>
        ` : '';

        listaTopicos.innerHTML = htmlUnidades + htmlAssuntosDiretos;
        aplicarFiltroSituacaoAssuntos();

        listaTopicos.querySelectorAll('[data-assunto]').forEach(botao =>
          botao.setAttribute(
            'aria-pressed',
            String(botao.dataset.assunto === assuntoSelecionado)
          )
        );

        listaTopicos.querySelectorAll('[data-progresso-campo="situacao_geral"]').forEach(campo => {
          campo.addEventListener('change', () => {
            const cartao = campo.closest('[data-cartao-assunto]');
            if (!cartao) return;
            cartao.classList.remove('status-em-andamento','status-concluido','status-pendente');
            const estado = campo.value;
            if (['em_andamento','concluido','pendente'].includes(estado)) cartao.classList.add('status-' + estado.replace('_','-'));
            const op = opcoesProgresso.situacao_geral.find(item => item[0] === estado);
            const rotulo = op ? op[1] : 'Não iniciado';
            const icone = estado === 'concluido' ? '✓' : estado === 'pendente' ? '!' : estado === 'em_andamento' ? '●' : '○';
            const indicador = cartao.querySelector('[data-indicador-situacao]');
            if (indicador) indicador.textContent = icone + ' ' + rotulo;
          });
        });
        listaTopicos.querySelectorAll('[data-salvar-progresso]').forEach(botao =>
          botao.addEventListener('click', () =>
            abrirFormularioProgresso(botao.dataset.salvarProgresso, botao)
          )
        );

        listaTopicos.querySelectorAll('[data-editar-sessao]').forEach(botao =>
          botao.addEventListener('click', () => {
            const cartao = botao.closest('[data-cartao-assunto]');
            const anterior = botao.dataset.editarSessao;
            const nova = window.prompt('Informe a data correta (AAAA-MM-DD):', anterior);
            if (nova === null) return;
            if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(nova)) {
              window.alert('Informe a data no formato AAAA-MM-DD.');
              return;
            }
            abrirSolicitacaoHistorico(cartao.dataset.cartaoAssunto, 'editar', anterior, nova);
          })
        );
        listaTopicos.querySelectorAll('[data-excluir-sessao]').forEach(botao =>
          botao.addEventListener('click', () => abrirSolicitacaoHistorico(
            botao.closest('[data-cartao-assunto]').dataset.cartaoAssunto, 'excluir', botao.dataset.excluirSessao, '', 'estudos'
          ))
        );

        listaTopicos.querySelectorAll('[data-editar-revisao]').forEach(botao =>
          botao.addEventListener('click', () => {
            const cartao = botao.closest('[data-cartao-assunto]');
            const anterior = botao.dataset.editarRevisao;
            const nova = window.prompt('Informe a data correta (AAAA-MM-DD):', anterior);
            if (nova === null) return;
            if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(nova)) { window.alert('Informe a data no formato AAAA-MM-DD.'); return; }
            abrirSolicitacaoHistorico(cartao.dataset.cartaoAssunto, 'editar', anterior, nova, 'revisoes');
          })
        );
        listaTopicos.querySelectorAll('[data-excluir-revisao]').forEach(botao =>
          botao.addEventListener('click', () => abrirSolicitacaoHistorico(
            botao.closest('[data-cartao-assunto]').dataset.cartaoAssunto, 'excluir', botao.dataset.excluirRevisao, '', 'revisoes'
          ))
        );

        listaTopicos.querySelectorAll('[data-assunto]').forEach(botao =>
          botao.addEventListener('click', () => {
            const id = botao.dataset.assunto;

            assuntoSelecionado = assuntoSelecionado === id ? null : id;

            listaTopicos.querySelectorAll('[data-assunto]').forEach(el =>
              el.setAttribute(
                'aria-pressed',
                String(el.dataset.assunto === assuntoSelecionado)
              )
            );

            renderizarAba();
          })
        );
      }

      function registrosDaAba(tipo) {
        const registros = conteudos[tipo] || [];

        return registros.filter(item =>
          item.disciplina_id === disciplinaId ||
          item.disciplinaId === disciplinaId ||
          (
            item.assunto_id &&
            (estrutura.assuntos || []).some(a =>
              a.id === item.assunto_id &&
              (
                a.disciplina_id === disciplinaId ||
                (estrutura.unidades || []).some(u =>
                  u.id === a.unidade_id &&
                  u.disciplina_id === disciplinaId
                )
              )
            )
          )
        );
      }

      function filtrarAssunto(registros) {
        return assuntoSelecionado
          ? registros.filter(item => item.assunto_id === assuntoSelecionado)
          : registros;
      }

      function renderizarListaConteudos(tipo) {
        const registros = filtrarAssunto(registrosDaAba(tipo)).sort(ordenar);

        if (!registros.length) {
          mostrarEstado(
            painel,
            'Nenhum conteúdo cadastrado',
            assuntoSelecionado
              ? 'Não há conteúdo cadastrado para este assunto nesta seção.'
              : 'Esta seção está pronta para receber conteúdos. Nenhum registro foi cadastrado ainda.'
          );
          return;
        }

        painel.innerHTML = `
          <div class="lista-conteudos">
            ${registros.map((item, i) => {
              const titulo = textoRegistro(item, ['titulo','nome']) ||
                `${tipo === 'resumos' ? 'Resumo' : tipo === 'revisoes' ? 'Revisão' : tipo === 'questoes' ? 'Conjunto de questões' : 'Flashcard'} ${i+1}`;

              const descricao = textoRegistro(item, [
                'descricao','resumo','enunciado','frente'
              ]);

              const corpo = textoRegistro(item, [
                'conteudo','texto','desenvolvimento','resposta',
                'verso','comentario','explicacao'
              ]);

              const descricaoDiferente = descricao &&
                descricao.trim() !== String(corpo || '').trim();

              const referencia = tipo === 'revisoes'
                ? textoRegistro(item, ['referencia','referencia_bibliografica'])
                : '';

              const dataElaboracao = tipo === 'revisoes'
                ? textoRegistro(item, ['data_elaboracao','data'])
                : '';

              const metadadosRevisao = tipo === 'revisoes' &&
                (referencia || dataElaboracao)
                ? `
                  <div class="metadados-revisao">
                    ${referencia ? `
                      <p>
                        <strong>Referência bibliográfica:</strong>
                        ${escapeHTML(referencia)}
                      </p>
                    ` : ''}

                    ${dataElaboracao ? `
                      <p>
                        <strong>Data de elaboração:</strong>
                        ${escapeHTML(dataElaboracao)}
                      </p>
                    ` : ''}
                  </div>
                `
                : '';

              const conteudoHTML = corpo
                ? tipo === 'revisoes'
                  ? `<div class="texto-revisao texto-markdown">${renderizarMarkdown(corpo)}</div>`
                  : `<div class="texto-markdown">${renderizarMarkdown(corpo)}</div>`
                : '';

              return `
                <article class="item-conteudo">
                  <h3>${escapeHTML(titulo)}</h3>

                  ${descricaoDiferente
                    ? `<p>${escapeHTML(descricao)}</p>`
                    : ''}

                  ${corpo || metadadosRevisao
                    ? `
                      <details>
                        <summary>Ver conteúdo</summary>
                        ${metadadosRevisao}
                        ${conteudoHTML}
                      </details>
                    `
                    : ''}
                </article>`;
            }).join('')}
          </div>`;
      }

      function renderizarMateriais() {
        const materiais = documentos.filter(doc =>
          String(doc.disciplina || '').trim().toLocaleLowerCase('pt-BR') ===
          disciplinaAtual.nome.trim().toLocaleLowerCase('pt-BR')
        );

        if (!materiais.length) {
          mostrarEstado(
            painel,
            'Nenhum material cadastrado',
            'Os documentos associados a esta disciplina em documentos.json aparecerão aqui.'
          );
          return;
        }

        painel.innerHTML = `
          <div class="lista-conteudos">
            ${materiais.map(doc => {
              const titulo = doc.titulo || 'Material sem título';

              const arquivos = Array.isArray(doc.arquivos) && doc.arquivos.length
                ? doc.arquivos
                : (doc.arquivo ? [doc.arquivo] : []);

              const links = arquivos.map((arquivo, i) => `
                <a class="material-link"
                  href="${escapeHTML(arquivo)}"
                  target="_blank"
                  rel="noopener">
                  ${arquivos.length > 1 ? `Abrir arquivo ${i+1}` : 'Abrir material'}
                </a>
              `).join('<br>');

              return `
                <article class="item-conteudo">
                  <h3>${escapeHTML(titulo)}</h3>
                  ${doc.categoria ? `<p>Categoria: ${escapeHTML(doc.categoria)}</p>` : ''}
                  ${doc.descricao ? `<p>${escapeHTML(doc.descricao)}</p>` : ''}
                  ${links || '<p>Arquivo ainda não associado.</p>'}
                </article>`;
            }).join('')}
          </div>`;
      }

      function renderizarAba() {
        const nomes = {
          resumos: 'Resumos',
          revisoes: 'Revisões de literatura',
          questoes: 'Questões',
          flashcards: 'Flashcards',
          fluxogramas: 'Fluxogramas',
          materiais: 'Materiais'
        };

        document.querySelectorAll('.aba-disciplina').forEach(botao => {
          if (!botao.dataset.aba) return;

          const ativo = botao.dataset.aba === abaAtual;

          botao.setAttribute('aria-selected', String(ativo));
          botao.tabIndex = ativo ? 0 : -1;
        });

        painel.setAttribute('aria-labelledby', `aba-${abaAtual}`);

        if (['resumos','revisoes','questoes','flashcards'].includes(abaAtual)) {
          renderizarListaConteudos(abaAtual);
        } else if (abaAtual === 'materiais') {
          renderizarMateriais();
        } else {
          mostrarEstado(
            painel,
            'Fluxogramas ainda não cadastrados',
            'Os fluxogramas vinculados à disciplina poderão ser adicionados futuramente como imagens ou arquivos estáticos.'
          );
        }

        if (assuntoSelecionado) {
          const assunto =
            (estrutura.assuntos || []).find(a => a.id === assuntoSelecionado) ||
            (estrutura.unidades || []).find(u => u.id === assuntoSelecionado);

          painel.insertAdjacentHTML('afterbegin', `
            <p class="aviso-filtro">
              Filtro ativo:
              ${escapeHTML(textoRegistro(assunto, ['nome','titulo']) || 'assunto selecionado')}
              —
              <a href="#" id="limpar-filtro">limpar filtro</a>
            </p>
          `);

          document.getElementById('limpar-filtro').addEventListener('click', event => {
            event.preventDefault();
            assuntoSelecionado = null;

            listaTopicos.querySelectorAll('[data-assunto]').forEach(el =>
              el.setAttribute('aria-pressed','false')
            );

            renderizarAba();
          });
        }

        painel.setAttribute('aria-labelledby', `aba-${abaAtual}`);
      }

      document.querySelectorAll('.aba-disciplina[data-aba]').forEach(botao =>
        botao.addEventListener('click', () => {
          abaAtual = botao.dataset.aba;
          renderizarAba();
        })
      );

      async function iniciar() {
        if (!disciplinaId) {
          mostrarErro(
            'O endereço não informou o identificador da disciplina. Volte ao currículo e selecione uma disciplina.'
          );
          return;
        }

        try {
          [estrutura, conteudos, documentos, progresso] = await Promise.all([
            carregarJSON('dados/estrutura.json'),
            carregarJSON('dados/conteudos.json'),
            carregarJSON('documentos.json'),
            carregarJSON('dados/progresso.json').catch(() => ({ progresso: [] }))
          ]);

          if (!Array.isArray(documentos)) documentos = [];
          if (!progresso || !Array.isArray(progresso.progresso)) progresso = { progresso: [] };

          disciplinaAtual = (estrutura.disciplinas || []).find(
            item => item.id === disciplinaId
          );

          if (!disciplinaAtual) {
            mostrarErro(
              'A disciplina solicitada não foi encontrada em dados/estrutura.json.'
            );
            return;
          }

          if (assuntoIdSolicitado) {
            const assuntoSolicitado = (estrutura.assuntos || []).find(
              item => item.id === assuntoIdSolicitado
            );

            if (
              assuntoSolicitado &&
              assuntoSolicitado.disciplina_id === disciplinaId
            ) {
              assuntoSelecionado = assuntoSolicitado.id;
            }
          }

          montarCabecalho();
          montarTopicos();
          renderizarAba();

        } catch (erro) {
          console.error(erro);

          mostrarErro(
            `${erro.message} Verifique se os arquivos JSON estão nos caminhos esperados e tente novamente.`
          );
        }
      }

      iniciar();
    })();
  </script>
</body>
</html>
