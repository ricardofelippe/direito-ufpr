
name: Cadastrar material
description: Enviar um novo material para a Biblioteca de Direito
title: "[Cadastro de material] "
body:
  - type: input
    id: titulo
    attributes:
      label: Título do material
      placeholder: Ex. Introdução à Teoria do Direito
    validations:
      required: true

  - type: dropdown
    id: disciplina
    attributes:
      label: Disciplina
      options:
        - Teoria do Direito
        - Filosofia do Direito
    validations:
      required: true

  - type: dropdown
    id: categoria
    attributes:
      label: Categoria
      options:
        - Texto de estudo
        - Resumo
        - Exercício
        - Mapa conceitual
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      placeholder: Explique brevemente o conteúdo do material.
    validations:
      required: false

  - type: input
    id: arquivo
    attributes:
      label: Caminho do PDF
      placeholder: documentos/teoria-do-direito/material.pdf
      description: Informe o caminho do PDF já enviado ao repositório.
    validations:
      required: false
