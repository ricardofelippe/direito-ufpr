
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca de Direito</title>
  <link rel="stylesheet" href="direito.css?v=3">
  <style>

    /* Cartões compactos e expansíveis */
    body.pagina-biblioteca .documento {
      padding: 0;
      overflow: hidden;
      align-self: start;
    }
    body.pagina-biblioteca .documento:hover {
      transform: none;
    }
    body.pagina-biblioteca .documento-resumo {
      position: relative;
      display: block;
      cursor: pointer;
      list-style: none;
      padding: 17px 42px 17px 18px;
      min-height: 100px;
    }
    body.pagina-biblioteca .documento-resumo::-webkit-details-marker {
      display: none;
    }
    body.pagina-biblioteca .documento-resumo::after {
      content: "+";
      position: absolute;
      right: 18px;
      top: 18px;
      color: #36d9dc;
      font: 22px Arial, sans-serif;
    }
    body.pagina-biblioteca details[open] > .documento-resumo::after {
      content: "−";
    }
    body.pagina-biblioteca .documento-resumo h3 {
      margin: 0 0 9px;
      font-size: 17px;
      line-height: 1.35;
    }
    body.pagina-biblioteca .documento-resumo p {
      margin: 4px 0 0;
      color: #a5b8ca;
      font-size: 12px;
    }
    body.pagina-biblioteca .documento-categoria {
      color: #71869b !important;
    }
    body.pagina-biblioteca .documento-conteudo {
      padding: 0 18px 18px;
      border-top: 1px solid #1b3041;
    }
    body.pagina-biblioteca .documento-conteudo > p:first-child {
      margin-top: 14px;
    }

    body.pagina-biblioteca .grupo-ano-biblioteca { margin: 26px 0; }
    body.pagina-biblioteca .grupo-ano-biblioteca > h3 {
      color: #19c7ce; font-size: 18px; margin: 0 0 12px;
    }
    body.pagina-biblioteca .disciplina-catalogo {
      background: #101b29; border: 1px solid #263b50; border-radius: 8px;
      margin: 9px 0; overflow: hidden;
    }
    body.pagina-biblioteca .disciplina-catalogo-resumo {
      display: flex; justify-content: space-between; align-items: center;
      gap: 14px; padding: 16px 18px; cursor: pointer; list-style: none;
    }
    body.pagina-biblioteca .disciplina-catalogo-resumo::-webkit-details-marker { display:none; }
    body.pagina-biblioteca .disciplina-catalogo-resumo strong { color:#e6edf5; font-size:14px; }
    body.pagina-biblioteca .quantidade-materiais { color:#91a8bb; font-size:12px; white-space:nowrap; }
    body.pagina-biblioteca .disciplina-catalogo-conteudo {
      padding: 4px 18px 16px; border-top:1px solid #263b50;
    }
    body.pagina-biblioteca .material-catalogo {
      padding: 13px 0; border-bottom:1px solid #263b50;
    }
    body.pagina-biblioteca .material-catalogo:last-child { border-bottom:0; }
    body.pagina-biblioteca .material-catalogo h4 { margin:5px 0 7px; color:#e6edf5; }
    body.pagina-biblioteca .material-catalogo p { color:#a5b8ca; }
    @media(max-width:600px) {
      body.pagina-biblioteca .disciplina-catalogo-resumo { align-items:flex-start; flex-direction:column; gap:5px; }
    }

    body.pagina-biblioteca > header.cabecalho-biblioteca {
      padding: 24px max(24px, calc((100% - 1120px) / 2));
      text-align: left;
      background: #0c1420;
    }
    .cabecalho-conteudo {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .cabecalho-biblioteca .sobretitulo {
      margin: 0 0 5px;
      color: #19c7ce;
      font: 11px Arial, sans-serif;
      letter-spacing: .13em;
    }
    body.pagina-biblioteca > header h1 {
      margin: 0;
      font: 700 25px Georgia, serif;
      letter-spacing: 0;
    }
    body.pagina-biblioteca > header p:last-child {
      margin: 5px 0 0;
    }
    .navegacao-biblioteca {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .navegacao-biblioteca a {
      display: inline-block;
      padding: 9px 12px;
      border: 1px solid #263b50;
      border-radius: 5px;
      color: #e6edf5;
      font: 13px Arial, sans-serif;
      text-decoration: none;
    }
    .navegacao-biblioteca a:hover {
      border-color: #19c7ce;
      color: #36d9dc;
    }
    body.pagina-biblioteca .conteudo-principal {
      max-width: 1120px;
      margin: 34px auto;
      padding: 0 24px 48px;
    }
    .controles-biblioteca {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .controles-biblioteca #busca {
      flex: 1 1 340px;
      width: auto;
      max-width: none;
    }
    @media(max-width:700px) {
      .cabecalho-conteudo { align-items:flex-start; flex-direction:column; }
      body.pagina-biblioteca > header.cabecalho-biblioteca { padding:22px 18px; }
      body.pagina-biblioteca .conteudo-principal { padding:0 16px 36px; margin:24px auto; }
      .controles-biblioteca #busca { flex-basis:100%; }
    }
  </style>

</head>

<body class="pagina-biblioteca">

  <header class="cabecalho-biblioteca">
    <div class="cabecalho-conteudo">
      <div>
        <p class="sobretitulo">DIREITO · UNIVERSIDADE FEDERAL DO PARANÁ</p>
        <h1>Biblioteca geral</h1>
        <p>Catálogo de materiais de todas as disciplinas</p>
      </div>
      <nav class="navegacao-biblioteca" aria-label="Navegação principal">
        <a href="index.html">⌂ Painel inicial</a>
        <a href="direito.html">← Currículo</a>
      </nav>
    </div>
  </header>

  <main id="inicio" class="conteudo-principal">

        <h2>Todos os documentos</h2>

        <!-- PESQUISA -->
        <div class="controles-biblioteca">
        <input
          type="search"
          id="busca"
          placeholder="Buscar por título, descrição ou palavra-chave..."
          aria-label="Buscar materiais"
        >

        <select id="filtro-disciplina">
          <option value="">Todas as disciplinas</option>
        </select>

        <select id="filtro-categoria" aria-label="Filtrar por categoria">
          <option value="">Todas as categorias</option>
        </select>
        </div>

        <!-- INDICADORES -->
        <div
          id="resumo-biblioteca"
          class="resumo-biblioteca">
        </div>

        <!-- ESTADO DA BIBLIOTECA -->
        <p id="estado" role="status">
          Carregando documentos...
        </p>

        <!-- LISTA DE MATERIAIS -->
        <section
          id="lista-documentos"
          class="lista-documentos">
        </section>

  </main>

  <script>

    async function carregarBiblioteca() {

      const busca = document.getElementById("busca");

      const filtroDisciplina =
        document.getElementById("filtro-disciplina");

      const filtroCategoria =
        document.getElementById("filtro-categoria");

      const lista =
        document.getElementById("lista-documentos");

      const estado =
        document.getElementById("estado");

      try {

        const [resposta, respostaEstrutura] = await Promise.all([
          fetch("./documentos.json"),
          fetch("./dados/estrutura.json")
        ]);

        if (!resposta.ok || !respostaEstrutura.ok) {
          throw new Error("Erro ao carregar os dados da biblioteca ou do currículo.");
        }

        const [todosDocumentos, estrutura] = await Promise.all([
          resposta.json(),
          respostaEstrutura.json()
        ]);

        // A Biblioteca geral exibe somente disciplinas obrigatórias
        // cadastradas na estrutura curricular oficial.
        const disciplinasObrigatorias = (estrutura.disciplinas || [])
          .filter(d => String(d.categoria || "").toLowerCase() === "obrigatoria");

        const normalizar = valor => String(valor || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLocaleLowerCase("pt-BR")
          .trim();

        const mapaDisciplinas = new Map(
          disciplinasObrigatorias.map(d => [normalizar(d.nome), d])
        );

        const titulosOcultos = new Set([
          "teste de associacao de pdf",
          "teste",
          "teste de integracao do formulario",
          "trabalho 1 - google docs"
        ]);

        const documentos = todosDocumentos.filter(doc => {
          const titulo = normalizar(doc.titulo);
          const categoria = normalizar(doc.categoria);

          // Oculta o cadastro duplicado classificado incorretamente como exercício.
          const resumoDuplicadoComCategoriaIncorreta =
            titulo === "resumo sobre introducao a teoria do direito" &&
            categoria === "exercicio";

          return mapaDisciplinas.has(normalizar(doc.disciplina)) &&
            !titulosOcultos.has(titulo) &&
            !resumoDuplicadoComCategoriaIncorreta;
        });

        const nomeComCodigo = nome => {
          const disciplina = mapaDisciplinas.get(normalizar(nome));
          return disciplina ? disciplina.codigo + " — " + disciplina.nome : nome;
        };

        // =====================================
        // INDICADORES DA BIBLIOTECA
        // =====================================

        function atualizarResumo() {

          const totalMateriais = documentos.length;

          const totalPDFs = documentos.reduce((total, doc) => {

            const arquivos = [
              ...(Array.isArray(doc.arquivos) ? doc.arquivos : []),
              doc.arquivo
            ].filter(Boolean);

            return total + new Set(arquivos).size;

          }, 0);

          const totalDisciplinas = disciplinasObrigatorias.length;

          const resumo =
            document.getElementById("resumo-biblioteca");

          resumo.replaceChildren();

          const indicadores = [
            {
              numero: totalMateriais,
              descricao: "Materiais cadastrados",
              icone: "📚"
            },
            {
              numero: totalPDFs,
              descricao: "Arquivos PDF",
              icone: "📄"
            },
            {
              numero: totalDisciplinas,
              descricao: "Disciplinas",
              icone: "🎓"
            }
          ];

          indicadores.forEach(indicador => {

            const cartao = document.createElement("div");
            cartao.className = "indicador-biblioteca";

            const icone = document.createElement("span");
            icone.className = "indicador-icone";
            icone.textContent = indicador.icone;

            const numero = document.createElement("strong");
            numero.className = "indicador-numero";
            numero.textContent = indicador.numero;

            const descricao = document.createElement("span");
            descricao.className = "indicador-descricao";
            descricao.textContent = indicador.descricao;

            cartao.append(icone, numero, descricao);

            resumo.appendChild(cartao);

          });

        }

        atualizarResumo();

        // =====================================
        // FILTROS E CATÁLOGO DE DISCIPLINAS
        // =====================================

        const disciplinas = [...disciplinasObrigatorias].sort((a, b) =>
          (Number(a.ano) || 99) - (Number(b.ano) || 99) ||
          (Number(a.ordem) || 99) - (Number(b.ordem) || 99) ||
          a.nome.localeCompare(b.nome, "pt-BR")
        );

        const categorias = [...new Set(
          documentos.map(doc => doc.categoria).filter(Boolean)
        )].sort();

        disciplinas.forEach(d => {
          const opcao = document.createElement("option");
          opcao.value = d.nome;
          opcao.textContent = d.codigo + " — " + d.nome;
          filtroDisciplina.appendChild(opcao);
        });

        categorias.forEach(nome => {
          const opcao = document.createElement("option");
          opcao.value = nome;
          opcao.textContent = nome;
          filtroCategoria.appendChild(opcao);
        });

        // =====================================
        // LINKS PARA CADASTRO E GERENCIAMENTO
        // =====================================

        function criarLinkAssociacao(texto, doc) {
          const parametros = new URLSearchParams({
            template: "associar-pdf.yml",
            title: "[Associar PDF] " + doc.titulo,
            titulo: doc.titulo,
            disciplina: doc.disciplina
          });
          const link = document.createElement("a");
          link.href = "https://github.com/ricardofelippe/direito-ufpr/issues/new?" + parametros.toString();
          link.textContent = texto;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          return link;
        }

        function criarLinkGerenciamento(texto, doc, operacao, arquivo) {
          const parametros = new URLSearchParams({
            template: "gerenciar-pdfs.yml",
            title: "[Gerenciar PDFs] " + doc.titulo,
            titulo: doc.titulo,
            disciplina: doc.disciplina,
            operacao: operacao
          });
          if (arquivo) parametros.set("arquivo_alvo", arquivo);
          const link = document.createElement("a");
          link.href = "https://github.com/ricardofelippe/direito-ufpr/issues/new?" + parametros.toString();
          link.textContent = texto;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          return link;
        }

        function arquivosDoDocumento(doc) {
          return [...new Set([
            ...(Array.isArray(doc.arquivos) ? doc.arquivos : []),
            doc.arquivo
          ].filter(Boolean))];
        }

        function criarCartaoMaterial(doc) {
          const cartao = document.createElement("article");
          cartao.className = "material-catalogo";

          const titulo = document.createElement("h4");
          titulo.textContent = doc.titulo || "Documento sem título";
          cartao.appendChild(titulo);

          const descricao = document.createElement("p");
          descricao.textContent = doc.descricao || "Sem descrição.";
          cartao.appendChild(descricao);

          if (doc.assunto) {
            const assunto = document.createElement("p");
            assunto.className = "material-assunto";
            assunto.textContent = "Assunto: " + doc.assunto;
            cartao.appendChild(assunto);
          }

          const arquivos = arquivosDoDocumento(doc);
          if (arquivos.length) {
            const listaArquivos = document.createElement("ul");
            listaArquivos.className = "lista-pdfs";

            arquivos.forEach((caminho, indice) => {
              const item = document.createElement("li");
              const abrir = document.createElement("a");
              abrir.href = caminho;
              abrir.textContent = decodeURIComponent(caminho.split("/").pop()) || "PDF " + (indice + 1);
              abrir.target = "_blank";
              abrir.rel = "noopener noreferrer";
              item.appendChild(abrir);

              const acoes = document.createElement("p");
              acoes.className = "acoes-pdf";
              acoes.append(
                criarLinkGerenciamento("Substituir", doc, "Substituir PDF", caminho),
                criarLinkGerenciamento("Remover", doc, "Remover PDF", caminho)
              );
              item.appendChild(acoes);
              listaArquivos.appendChild(item);
            });
            cartao.appendChild(listaArquivos);

            const adicionar = document.createElement("p");
            adicionar.appendChild(criarLinkGerenciamento("Adicionar PDFs", doc, "Adicionar PDFs", ""));
            cartao.appendChild(adicionar);
          } else {
            const aviso = document.createElement("p");
            aviso.className = "sem-pdf";
            aviso.textContent = "PDF ainda não anexado.";
            cartao.append(aviso, criarLinkAssociacao("Associar PDF", doc));
          }

          return cartao;
        }

        // =====================================
        // EXIBE TODAS AS DISCIPLINAS OBRIGATÓRIAS
        // =====================================

        function exibirDocumentos() {
          const termo = normalizar(busca.value);
          const disciplinaSelecionada = filtroDisciplina.value;
          const categoriaSelecionada = filtroCategoria.value;
          lista.replaceChildren();

          const grupos = new Map();

          disciplinas.forEach(d => {
            const docsDaDisciplina = documentos.filter(doc =>
              normalizar(doc.disciplina) === normalizar(d.nome)
            );

            const docsFiltrados = docsDaDisciplina.filter(doc =>
              !categoriaSelecionada || doc.categoria === categoriaSelecionada
            );

            const textoDisciplina = normalizar([d.codigo, d.nome, d.descricao].join(" "));
            const docsCorrespondem = docsFiltrados.filter(doc =>
              normalizar([doc.titulo, doc.descricao, doc.categoria].join(" ")).includes(termo)
            );

            const correspondeBusca = !termo ||
              textoDisciplina.includes(termo) ||
              docsCorrespondem.length > 0;

            if (disciplinaSelecionada && d.nome !== disciplinaSelecionada) return;
            if (categoriaSelecionada && docsFiltrados.length === 0) return;
            if (!correspondeBusca) return;

            const ano = d.ano ? String(d.ano) + "º ano" : "Ano não informado";
            if (!grupos.has(ano)) grupos.set(ano, []);
            grupos.get(ano).push({
              disciplina: d,
              documentos: termo && !textoDisciplina.includes(termo)
                ? docsCorrespondem
                : docsFiltrados
            });
          });

          grupos.forEach((itens, ano) => {
            const secao = document.createElement("section");
            secao.className = "grupo-ano-biblioteca";

            const tituloAno = document.createElement("h3");
            tituloAno.textContent = ano;
            secao.appendChild(tituloAno);

            itens.forEach(({ disciplina: d, documentos: docs }) => {
              const cartao = document.createElement("details");
              cartao.className = "disciplina-catalogo";

              const resumo = document.createElement("summary");
              resumo.className = "disciplina-catalogo-resumo";

              const nome = document.createElement("strong");
              nome.textContent = d.codigo + " — " + d.nome;

              const quantidade = document.createElement("span");
              quantidade.className = "quantidade-materiais";
              quantidade.textContent = docs.length + (docs.length === 1 ? " material" : " materiais");

              resumo.append(nome, quantidade);
              cartao.appendChild(resumo);

              const conteudo = document.createElement("div");
              conteudo.className = "disciplina-catalogo-conteudo";

              if (docs.length) {
                docs.forEach(doc => conteudo.appendChild(criarCartaoMaterial(doc)));
              } else {
                const vazio = document.createElement("p");
                vazio.textContent = "Nenhum material cadastrado para esta disciplina.";
                conteudo.appendChild(vazio);

                const cadastrar = document.createElement("a");
                cadastrar.href = "cadastro.html?" + new URLSearchParams({ disciplina: d.nome }).toString();
                cadastrar.textContent = "Cadastrar material";
                conteudo.appendChild(cadastrar);
              }

              cartao.appendChild(conteudo);
              secao.appendChild(cartao);
            });

            lista.appendChild(secao);
          });

          const totalDisciplinasExibidas = [...grupos.values()].reduce((total, itens) => total + itens.length, 0);
          const totalMateriaisExibidos = [...grupos.values()].reduce((total, itens) =>
            total + itens.reduce((soma, item) => soma + item.documentos.length, 0), 0);

          estado.textContent = totalDisciplinasExibidas
            ? totalDisciplinasExibidas + " disciplina(s) exibida(s), com " + totalMateriaisExibidos + " material(is) correspondente(s)."
            : "Nenhuma disciplina encontrada com esses filtros.";
        }

        // =====================================
        // LIMPAR FILTROS
        // =====================================

        function limparFiltros(secao) {

          busca.value = "";
          filtroDisciplina.value = "";
          filtroCategoria.value = "";

          exibirDocumentos();

        }

        // =====================================
        // EVENTOS DOS FILTROS
        // =====================================

        busca.addEventListener("input", () => {

          exibirDocumentos();

        });

        filtroDisciplina.addEventListener("change", () => {

          exibirDocumentos();

        });

        filtroCategoria.addEventListener("change", () => {

          exibirDocumentos();

        });

        // =====================================
        // INICIALIZAÇÃO
        // =====================================

        exibirDocumentos();

      } catch (erro) {

        console.error(erro);

        estado.textContent =
          "Erro ao carregar a biblioteca. Verifique documentos.json.";

      }

    }

    carregarBiblioteca();

  </script>

</body>
</html>
