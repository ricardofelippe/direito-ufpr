<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Currículo de Direito da UFPR organizado para acompanhar meus estudos e acessar os materiais de cada disciplina.">
  <title>Currículo de Direito - UFPR</title>
  <link rel="stylesheet" href="direito.css">
  <style>
    /* Estilos exclusivos do currículo: preservam os estilos globais e não alteram a biblioteca. */
    body.pagina-curriculo {
      --fundo: #070b12;
      --fundo-secundario: #0c1420;
      --superficie: #101b29;
      --superficie-hover: #172638;
      --borda: #1b3041;
      --azul: #19c7ce;
      --azul-claro: #36d9dc;
      --azul-fundo: #10343d;
      --texto: #e6edf5;
      --texto-secundario: #a5b8ca;
      --texto-suave: #71869b;
      background: var(--fundo);
      color: var(--texto);
    }

    .pagina-curriculo > header {
      background: linear-gradient(135deg, #0c1420, #101f2c);
      border-bottom: 1px solid var(--borda);
      padding: 34px 20px 30px;
    }

    .cabecalho-curriculo {
      max-width: 1240px;
      margin: 0 auto;
    }

    .cabecalho-curriculo h1 {
      font-size: clamp(25px, 3vw, 34px);
      letter-spacing: -0.5px;
    }

    .cabecalho-curriculo p {
      margin: 7px 0 0;
      color: var(--texto-secundario);
    }

    .atalhos-curriculo {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .atalhos-curriculo a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      background: rgba(16, 27, 41, .8);
      color: var(--texto);
      text-decoration: none;
      transition: .2s ease;
    }

    .atalhos-curriculo a:hover {
      border-color: var(--azul);
      color: var(--azul-claro);
      background: var(--superficie-hover);
    }

    .pagina-curriculo main {
      max-width: 1240px;
      margin: 30px auto 60px;
    }

    .introducao-curriculo {
      margin: 0 0 30px;
      color: var(--texto-secundario);
      max-width: 760px;
    }

    .ano-curriculo,
    .secao-sem-ano {
      margin: 34px 0 42px;
    }

    .titulo-ano,
    .titulo-sem-ano {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 0 0 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--borda);
      color: var(--texto);
      font-size: 23px;
    }

    /* Cada ano funciona como um painel expansível independente. */
    .titulo-ano {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    .titulo-ano::-webkit-details-marker,
    .titulo-sem-ano::-webkit-details-marker {
      display: none;
    }

    .titulo-ano::after,
    .titulo-sem-ano::after {
      content: "+";
      margin-left: auto;
      color: var(--azul-claro);
      font: 24px Arial, sans-serif;
    }

    .ano-curriculo[open] > .titulo-ano::after,
    .secao-sem-ano[open] > .titulo-sem-ano::after {
      content: "−";
    }

    .titulo-sem-ano {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    .titulo-sem-ano:hover {
      color: var(--azul-claro);
    }

    .conteudo-secao-sem-ano {
      padding-top: 1px;
    }

    .titulo-ano:hover {
      color: var(--azul-claro);
    }

    .resumo-contagens-ano {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-left: 4px;
      color: var(--texto-suave);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .resumo-contagens-ano .separador-contagens {
      color: var(--borda);
    }

    .titulo-ano .numero-ano {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--azul-fundo);
      color: var(--azul-claro);
      font-size: 16px;
      font-weight: 700;
    }

    .grupo-categoria {
      margin: 22px 0 26px;
    }

    .titulo-categoria {
      margin: 0 0 12px;
      color: var(--texto-secundario);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .grade-disciplinas {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .cartao-disciplina-wrapper {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .indicador-ordem-disciplina {
      align-self: flex-start;
      color: var(--texto-suave);
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .5px;
      line-height: 1.2;
    }

    .controle-status-disciplina {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .seletor-status-disciplina {
      max-width: 150px;
      padding: 5px 8px;
      border: 1px solid var(--borda);
      border-radius: 6px;
      background: var(--fundo-secundario);
      color: var(--texto-secundario);
      font-size: 11px;
    }

    .acao-status-disciplina {
      align-self: flex-start;
      border: 0;
      padding: 4px 2px;
      background: transparent;
      color: var(--azul-claro);
      font: 11px Arial, sans-serif;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .acao-status-disciplina[hidden] {
      display: none;
    }

    .acao-status-disciplina:hover {
      color: #fff;
    }


    /* Cartões de disciplinas expansíveis */
    .cartao-disciplina {
      display: block;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      cursor: default;
    }

    .resumo-cartao-disciplina {
      display: block;
      padding: 16px 18px;
      list-style: none;
      cursor: pointer;
    }

    .resumo-cartao-disciplina::-webkit-details-marker {
      display: none;
    }

    .resumo-cartao-disciplina::after {
      content: "+";
      float: right;
      margin: -27px 2px 0 10px;
      color: var(--azul-claro);
      font: 22px Arial, sans-serif;
    }

    .cartao-disciplina[open] > .resumo-cartao-disciplina::after {
      content: "−";
    }

    .resumo-cartao-disciplina .cartao-topo {
      padding-right: 24px;
    }

    .descricao-disciplina {
      margin: 9px 0 0;
      color: var(--texto-secundario);
      font-size: 12px;
      line-height: 1.5;
    }

    .link-informacoes-pedagogicas {
      color: var(--azul-claro);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .link-informacoes-pedagogicas:hover {
      color: var(--destaque);
    }

    .conteudo-cartao-disciplina {
      padding: 0 18px 16px;
      border-top: 1px solid var(--borda);
    }

    .ficha-pedagogica {
      margin-top: 12px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      background: rgba(255,255,255,.015);
      overflow: hidden;
    }

    .ficha-pedagogica > summary,
    .ficha-campo > summary {
      list-style: none;
      cursor: pointer;
    }

    .ficha-pedagogica > summary::-webkit-details-marker,
    .ficha-campo > summary::-webkit-details-marker { display: none; }

    .ficha-pedagogica > summary {
      padding: 10px 12px;
      color: var(--azul-claro);
      font-size: 12px;
      font-weight: 700;
    }

    .ficha-pedagogica > summary::after,
    .ficha-campo > summary::after {
      content: "+";
      float: right;
      color: var(--azul-claro);
      font-size: 15px;
      line-height: 1;
    }

    .ficha-pedagogica[open] > summary::after,
    .ficha-campo[open] > summary::after { content: "−"; }

    .ficha-pedagogica-conteudo {
      padding: 0 10px 10px;
      border-top: 1px solid var(--borda);
    }

    .cronograma-previsto .ficha-pedagogica-conteudo {
      padding: 10px 11px 12px;
    }

    .atividade-cronograma {
      padding: 12px 0;
      border-bottom: 1px solid var(--borda);
    }

    .atividade-cronograma:last-child {
      border-bottom: 0;
      padding-bottom: 4px;
    }

    .atividade-cronograma-cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 7px;
    }

    .atividade-cronograma-tipo {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border: 1px solid rgba(47, 213, 211, .28);
      border-radius: 20px;
      background: rgba(47, 213, 211, .09);
      color: var(--azul-claro);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .atividade-cronograma-data {
      color: var(--texto-secundario);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .atividade-cronograma-linha-titulo {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .atividade-cronograma-titulo {
      margin: 0;
      color: var(--texto);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      flex: 1;
      min-width: 0;
    }

    .atividade-cronograma-peso {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border: 1px solid rgba(244, 199, 92, .35);
      border-radius: 20px;
      background: rgba(194, 145, 35, .13);
      color: #f2d17e;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 700;
      white-space: nowrap;
    }

    .atividade-cronograma-observacao {
      margin: 6px 0 0;
      color: var(--texto-secundario);
      font-size: 12px;
      line-height: 1.5;
    }

    .importacao-cronograma {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--borda);
    }

    .importacao-cronograma label {
      display: block;
      margin-bottom: 6px;
      color: var(--texto-secundario);
      font-size: 11px;
      font-weight: 600;
    }

    .importacao-cronograma textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 150px;
      padding: 9px;
      border: 1px solid var(--borda);
      border-radius: 7px;
      background: var(--fundo-secundario);
      color: var(--texto);
      font: 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      resize: vertical;
    }

    .botao-validar-cronograma {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 9px;
      padding: 9px 12px;
      border: 0;
      border-radius: 7px;
      background: var(--azul);
      color: #061116;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .botao-validar-cronograma + .botao-validar-cronograma {
      background: transparent;
      border: 1px solid var(--azul);
      color: var(--azul-claro);
    }

    .resultado-validacao-cronograma {
      margin-top: 9px;
      color: var(--texto-secundario);
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .resultado-validacao-cronograma.erro { color: #ff9b9b; }
    .resultado-validacao-cronograma.sucesso { color: var(--azul-claro); }

    .ficha-campo {
      border-bottom: 1px solid var(--borda);
    }

    .ficha-campo:last-of-type { border-bottom: 0; }

    .ficha-campo > summary {
      padding: 9px 2px;
      color: var(--texto-secundario);
      font-size: 11px;
      font-weight: 600;
    }

    .ficha-campo > p {
      margin: 0 2px 11px;
      color: var(--texto);
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .ficha-fonte {
      display: inline-block;
      margin-top: 9px;
      font-size: 10px;
      color: var(--texto-suave);
    }

    .conteudo-cartao-disciplina .painel-progresso-disciplina {
      margin-top: 12px;
    }

    .conteudo-cartao-disciplina .indicador-acesso {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
    }

    .resumo-cartao-disciplina:focus-visible {
      outline: 2px solid var(--azul-claro);
      outline-offset: -3px;
    }

    .cartao-disciplina {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 132px;
      padding: 17px 18px 15px;
      border: 1px solid var(--borda);
      border-left: 3px solid var(--azul);
      border-radius: 10px;
      background: var(--superficie);
      color: var(--texto);
      text-decoration: none;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .cartao-disciplina:hover {
      transform: translateY(-2px);
      border-color: var(--azul);
      background: var(--superficie-hover);
      color: #fff;
    }

    .cartao-disciplina:focus-visible,
    .atalhos-curriculo a:focus-visible,
    .botao-tentar-novamente:focus-visible {
      outline: 2px solid var(--azul-claro);
      outline-offset: 3px;
    }

    .cartao-topo {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .nome-disciplina {
      margin: 0;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }

    .codigo-disciplina {
      display: block;
      width: fit-content;
      margin: 0 0 7px;
      color: var(--azul-claro);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .65px;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .situacao-disciplina {
      flex: 0 0 auto;
      padding: 3px 8px;
      border: 1px solid #66552c;
      border-radius: 20px;
      background: #332b19;
      color: #e8c978;
      font-size: 10px;
      line-height: 1.5;
      white-space: nowrap;
    }

    .situacao-disciplina.ativa {
      border-color: #245b50;
      background: #12372f;
      color: #83d8bd;
    }

    .situacao-disciplina.inativa {
      border-color: #5a3941;
      background: #321e25;
      color: #e7a0aa;
    }

    .etiquetas-disciplina {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
    }

    .indicador-inicio {
      padding: 3px 8px;
      border: 1px solid #465568;
      border-radius: 20px;
      background: #202d3b;
      color: #b8c7d6;
      font-size: 10px;
      line-height: 1.5;
      white-space: nowrap;
    }

    .indicador-inicio.iniciada {
      border-color: #245b50;
      background: #12372f;
      color: #83d8bd;
    }

    .indicador-acesso {
      margin-top: auto;
      padding-top: 12px;
      color: var(--azul-claro);
      font-size: 11px;
    }

    .painel-progresso-disciplina {
      display: grid;
      gap: 9px;
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid var(--borda);
    }

    .distribuicao-situacao {
      color: var(--texto-secundario);
      font-size: 10px;
      line-height: 1.5;
    }

    .linha-percentual {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px 10px;
      align-items: center;
      color: var(--texto-secundario);
      font-size: 10px;
    }

    .linha-percentual strong {
      color: var(--texto);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .barra-percentual {
      grid-column: 1 / -1;
      height: 5px;
      overflow: hidden;
      border-radius: 10px;
      background: #243445;
    }

    .barra-percentual span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--azul);
    }

    .cartao-topico-previsto {
      min-height: 132px;
      padding: 17px 18px;
      border: 1px dashed #28515a;
      border-radius: 10px;
      background: rgba(16, 52, 61, .32);
    }

    .cartao-topico-previsto strong {
      display: block;
      margin-bottom: 8px;
      color: var(--azul-claro);
      font-size: 15px;
    }

    .cartao-topico-previsto p {
      margin: 0;
      color: var(--texto-secundario);
      font-size: 13px;
    }

    .resumo-topicas {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 12px;
      color: var(--texto-secundario);
      font-size: 12px;
    }

    .estado-carregamento,
    .estado-erro,
    .estado-vazio {
      padding: 22px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      background: var(--superficie);
      color: var(--texto-secundario);
    }

    .estado-erro {
      border-color: #684047;
      color: #efb1b8;
    }

    .botao-tentar-novamente {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 13px;
      border: 1px solid var(--azul);
      border-radius: 7px;
      background: var(--azul-fundo);
      color: var(--azul-claro);
      cursor: pointer;
      font: inherit;
    }

    .rodape-curriculo {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--borda);
      color: var(--texto-suave);
      font-size: 12px;
      text-align: center;
    }


    .busca-curriculo,
    .painel-filtros-disciplinas {
      margin: 0 0 14px;
      padding: 0;
      border: 1px solid var(--borda);
      border-radius: 10px;
      background: var(--superficie);
      overflow: hidden;
    }

    .gatilho-painel-curriculo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      color: var(--texto);
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .gatilho-painel-curriculo::-webkit-details-marker {
      display: none;
    }

    .gatilho-painel-curriculo::before {
      content: "+";
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid var(--borda);
      border-radius: 6px;
      color: var(--azul-claro);
      font-size: 17px;
      line-height: 1;
    }

    details[open] > .gatilho-painel-curriculo::before {
      content: "−";
    }

    .gatilho-painel-curriculo:hover {
      background: var(--superficie-hover);
      color: var(--azul-claro);
    }

    .gatilho-painel-curriculo:focus-visible {
      outline: 2px solid var(--azul-claro);
      outline-offset: -3px;
    }

    .conteudo-painel-curriculo {
      padding: 0 18px 18px;
    }

    .busca-curriculo label {
      display: block;
      margin-bottom: 9px;
      color: var(--texto);
      font-weight: 700;
    }

    .campo-busca-curriculo {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      background: var(--fundo-secundario);
      color: var(--texto);
      font: inherit;
    }

    .campo-busca-curriculo:focus {
      outline: 2px solid var(--azul-claro);
      outline-offset: 2px;
    }

    .ajuda-busca-curriculo {
      margin: 8px 0 0;
      color: var(--texto-suave);
      font-size: 12px;
    }

    .acoes-busca-curriculo,
    .acoes-filtros-disciplinas {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .botao-aplicar-curriculo {
      padding: 9px 14px;
      border: 1px solid var(--azul);
      border-radius: 7px;
      background: var(--azul-fundo);
      color: var(--azul-claro);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .botao-aplicar-curriculo:hover {
      background: var(--superficie-hover);
    }

    .botao-aplicar-curriculo:focus-visible,
    .botao-limpar-busca:focus-visible {
      outline: 2px solid var(--azul-claro);
      outline-offset: 2px;
    }

    .botao-limpar-busca {
      padding: 9px 12px;
      border: 1px solid var(--borda);
      border-radius: 7px;
      background: transparent;
      color: var(--texto-secundario);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    /* O atributo hidden deve prevalecer sobre os estilos de layout flex/grid. */
    .filtros-busca-curriculo[hidden],
    .resultados-busca-curriculo[hidden],
    .indicador-filtros-ativos[hidden] {
      display: none !important;
    }

  <script>
    (() => {
      'use strict';

      const URL_ESTRUTURA = './dados/estrutura.json';
      const elementoCurriculo = document.getElementById('curriculo');
      let registrosProgresso = [];
      let ofertas = [];

      const categorias = {
        obrigatoria: 'Disciplinas obrigatórias',
        atividade_complementar: 'Atividades curriculares complementares',
        npj: 'Núcleo de Prática Jurídica (NPJ)',
        outros_setores: 'Disciplinas ofertadas a outros setores'
      };

      const ordemCategorias = [
        'obrigatoria',
        'atividade_complementar',
        'npj',
        'outros_setores'
      ];

      function criarElemento(tag, classe, texto) {
        const elemento = document.createElement(tag);
        if (classe) elemento.className = classe;
        if (texto !== undefined && texto !== null) elemento.textContent = texto;
        return elemento;
      }

      function compararOrdemCurricular(a, b) {
        const anoA = a.ano == null || a.ano === '' ? 6 :
          (Number(a.ano) >= 1 && Number(a.ano) <= 5 ? Number(a.ano) : 7 + Number(a.ano || 0));
        const anoB = b.ano == null || b.ano === '' ? 6 :
          (Number(b.ano) >= 1 && Number(b.ano) <= 5 ? Number(b.ano) : 7 + Number(b.ano || 0));
        const ordemA = Number.isFinite(Number(a.ordem)) ? Number(a.ordem) : 9999;
        const ordemB = Number.isFinite(Number(b.ordem)) ? Number(b.ordem) : 9999;
        return anoA - anoB || ordemA - ordemB ||
          String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR');
      }

      function ordenarRegistros(registros) {
        // A ordem dos cartões e a numeração seguem o mesmo critério:
        // ativos primeiro dentro de cada ano/categoria; depois os demais,
        // preservando a ordem curricular entre os registros de cada grupo.
        return [...registros].sort((a, b) => {
          const prioridadeA = String(a.status || 'pendente').toLowerCase() === 'ativa' ? 0 : 1;
          const prioridadeB = String(b.status || 'pendente').toLowerCase() === 'ativa' ? 0 : 1;
          return prioridadeA - prioridadeB || compararOrdemCurricular(a, b);
        });
      }

      function calcularProgressoDisciplina(disciplinaId) {
        const assuntos = (estruturaAtual.assuntos || []).filter(
          assunto => assunto.disciplina_id === disciplinaId
        );
        const porAssunto = new Map(
          registrosProgresso.map(registro => [registro.assunto_id, registro])
        );
        const situacoes = {
          nao_iniciado: 0,
          em_andamento: 0,
          concluido: 0,
          pendente: 0
        };

        let conteudoFeito = 0;
        let assuntosIniciados = 0;

        assuntos.forEach(assunto => {
          const registro = porAssunto.get(assunto.id) || {};
          const situacao = registro.situacao_geral || 'nao_iniciado';
          if (Object.prototype.hasOwnProperty.call(situacoes, situacao)) {
            situacoes[situacao]++;
          } else {
            situacoes.nao_iniciado++;
          }

          if (registro.conteudo_status === 'estudado') conteudoFeito++;

          const estudoIniciado =
            ['em_andamento', 'concluido'].includes(registro.situacao_geral) ||
            ['em_andamento', 'estudado'].includes(registro.conteudo_status);
          if (estudoIniciado) assuntosIniciados++;
        });

        const percentual = (feito, total) => total
          ? Math.round((feito / total) * 100)
          : null;

        return {
          total: assuntos.length,
          situacoes,
          iniciados: assuntosIniciados,
          conteudo: percentual(conteudoFeito, assuntos.length)
        };
      }

      function adicionarIndicadorPercentual(container, rotulo, valor) {
        const linha = criarElemento('div', 'linha-percentual');
        linha.appendChild(criarElemento('span', '', rotulo));
        linha.appendChild(criarElemento('strong', '', valor === null ? 'N/A' : `${valor}%`));

        const barra = criarElemento('div', 'barra-percentual');
        barra.setAttribute('aria-hidden', 'true');
        const preenchimento = criarElemento('span');
        preenchimento.style.width = `${valor === null ? 0 : valor}%`;
        barra.appendChild(preenchimento);
        linha.appendChild(barra);
        container.appendChild(linha);
      }

      let estruturaAtual = null;
      let indicadoresOrdemDisciplinas = new Map();

      function criarCartao(disciplina) {
        const wrapper = criarElemento('div', 'cartao-disciplina-wrapper');
        const indicador = indicadoresOrdemDisciplinas.get(disciplina.id);
        if (indicador) {
          const posicao = criarElemento('span', 'indicador-ordem-disciplina', indicador.texto);
          posicao.setAttribute('aria-label', indicador.ariaLabel);
          wrapper.appendChild(posicao);
        }
        const cartao = criarElemento('details', 'cartao-disciplina');

        const resumo = criarElemento('summary', 'resumo-cartao-disciplina');
        if (disciplina.codigo) {
          resumo.appendChild(criarElemento('span', 'codigo-disciplina', disciplina.codigo));
        }

        const topo = criarElemento('div', 'cartao-topo');
        const nome = criarElemento('h4', 'nome-disciplina', disciplina.nome || 'Disciplina sem nome');
        topo.appendChild(nome);
        resumo.appendChild(topo);

        const status = String(disciplina.status || 'pendente').toLowerCase();
        if (status === 'ativa') {
          cartao.classList.add('disciplina-ativa');
        } else if (status === 'finalizada') {
          cartao.classList.add('disciplina-finalizada');
        }
        const rotulosStatus = {
          ativa: 'Ativa',
          inativa: 'Inativa',
          pendente: 'Pendente',
          finalizada: 'Finalizada'
        };
        const etiquetas = criarElemento('div', 'etiquetas-disciplina');
        etiquetas.appendChild(criarElemento(
          'span',
          `situacao-disciplina ${['ativa', 'inativa', 'finalizada'].includes(status) ? status : ''}`.trim(),
          rotulosStatus[status] || status
        ));

        const progressoDisciplina = calcularProgressoDisciplina(disciplina.id);
        const inicio = progressoDisciplina.iniciados > 0;
        etiquetas.appendChild(criarElemento(
          'span',
          `indicador-inicio ${inicio ? 'iniciada' : ''}`.trim(),
          inicio ? 'Estudos iniciados' : 'Não iniciada'
        ));
        topo.appendChild(etiquetas);

        const ficha = disciplina.informacoes_pedagogicas;
        const possuiFicha = ficha && Object.keys(ficha).some(chave =>
          !['fonte', 'fonte_titulo', 'fonte_data'].includes(chave) && ficha[chave]
        );
        resumo.appendChild(criarElemento(
          'p',
          'descricao-disciplina',
          disciplina.descricao || ''
        ));
        cartao.appendChild(resumo);

        const conteudo = criarElemento('div', 'conteudo-cartao-disciplina');

        if (status === 'ativa') {
          const oferta = ofertas.find(item => item.disciplina_id === disciplina.id) || null;
          const painelCronograma = criarElemento('details', 'ficha-pedagogica cronograma-previsto');
          const tituloCronograma = oferta
            ? 'Cronograma previsto de atividades · ' + oferta.periodo
            : 'Cronograma previsto de atividades';
          painelCronograma.appendChild(criarElemento('summary', '', tituloCronograma));
          const corpoCronograma = criarElemento('div', 'ficha-pedagogica-conteudo');
          const atividades = oferta && Array.isArray(oferta.cronograma_previsto)
            ? oferta.cronograma_previsto
            : [];

          if (atividades.length) {
            const atividadesOrdenadas = [...atividades].sort((a, b) => {
              if (!a.data) return 1;
              if (!b.data) return -1;
              return a.data.localeCompare(b.data);
            });
            atividadesOrdenadas.forEach((atividade, indice) => {
              const item = criarElemento('article', 'atividade-cronograma');
              const cabecalho = criarElemento('div', 'atividade-cronograma-cabecalho');
              const tipo = String(atividade.tipo || 'outro');
              const tiposRotulo = {prova:'Prova',trabalho:'Trabalho',seminario:'Seminário',entrega:'Entrega',outro:'Outra atividade'};
              cabecalho.appendChild(criarElemento('span','atividade-cronograma-tipo',tiposRotulo[tipo] || 'Outra atividade'));
              const data = atividade.data ? atividade.data.split('-').reverse().join('/') : 'Data a definir';
              cabecalho.appendChild(criarElemento('span','atividade-cronograma-data',data));
              item.appendChild(cabecalho);
              const observacaoOriginal = String(atividade.observacao || '');
              const pesoEncontrado = observacaoOriginal.match(/peso\s*(?:de\s*)?(\d+(?:[.,]\d+)?)\s*%/i);
              const linhaTitulo = criarElemento('div','atividade-cronograma-linha-titulo');
              linhaTitulo.appendChild(criarElemento('h4','atividade-cronograma-titulo',(indice+1)+') '+(atividade.titulo||'Atividade sem título')));
              if(pesoEncontrado) linhaTitulo.appendChild(criarElemento('span','atividade-cronograma-peso','Peso '+pesoEncontrado[1].replace(',','.')+'%'));
              item.appendChild(linhaTitulo);
              const observacaoLimpa = observacaoOriginal
                .replace(/[,;]?\s*peso\s*(?:de\s*)?\d+(?:[.,]\d+)?\s*%(?:\s*(?:na|da)\s+nota\s+final)?/i,'')
                .replace(/^\s*[,;:.]\s*|[,;:.]\s*$/g,'').trim();
              if(observacaoLimpa) item.appendChild(criarElemento('p','atividade-cronograma-observacao',observacaoLimpa));
              corpoCronograma.appendChild(item);
            });
          } else {
            corpoCronograma.appendChild(criarElemento('p','estado-cronograma-vazio',
              oferta ? 'Ainda não há atividades cadastradas para esta oferta. Importe a síntese do NotebookLM.' : 'Informe o período letivo para iniciar o cronograma desta disciplina.'));
          }

          const importacao = criarElemento('div','importacao-cronograma');
          const rotuloPeriodo = criarElemento('label','','Período letivo da oferta (AAAA/S)');
          const campoPeriodo = criarElemento('input');
          campoPeriodo.type = 'text';
          campoPeriodo.placeholder = 'Ex.: 2028/1';
          campoPeriodo.value = oferta ? oferta.periodo : '';
          campoPeriodo.id = 'periodo-cronograma-' + disciplina.id;
          campoPeriodo.setAttribute('aria-label','Período letivo da oferta');
          const rotuloJson = criarElemento('label','','Importar síntese JSON do NotebookLM');
          const campoJson = criarElemento('textarea');
          campoJson.id = 'json-cronograma-' + disciplina.id;
          campoJson.placeholder = 'Cole aqui o JSON produzido pelo NotebookLM.';
          campoJson.setAttribute('aria-label','JSON do cronograma previsto');
          const botaoValidar = criarElemento('button','botao-validar-cronograma','Validar JSON');
          botaoValidar.type='button';
          const botaoEnviar = criarElemento('button','botao-validar-cronograma','Continuar para salvar no GitHub');
          botaoEnviar.type='button';
          botaoEnviar.hidden=true;
          const resultadoValidacao = criarElemento('div','resultado-validacao-cronograma');
          resultadoValidacao.setAttribute('aria-live','polite');
          let dadosValidados=null;
          let ofertaAlvo=null;

          botaoValidar.addEventListener('click',()=>{
            dadosValidados=null; ofertaAlvo=null; botaoEnviar.hidden=true;
            resultadoValidacao.className='resultado-validacao-cronograma'; resultadoValidacao.textContent='';
            try{
              const periodo=campoPeriodo.value.trim();
              if(!/^\d{4}\/[12]$/.test(periodo)) throw new Error('Informe o período no formato AAAA/S, por exemplo 2028/1.');
              const idOferta=disciplina.id+'-'+periodo.replace('/','-');
              const existentes=ofertas.filter(item=>item.id===idOferta);
              if(existentes.length>1) throw new Error('Há ofertas duplicadas para esta disciplina e período.');
              ofertaAlvo=existentes[0]||{
                id:idOferta,disciplina_id:disciplina.id,disciplina:disciplina.nome,periodo,
                situacao:'em_andamento',tipo_registro:'cronograma'
              };
              const dados=JSON.parse(campoJson.value);
              if(!dados||typeof dados!=='object'||Array.isArray(dados)) throw new Error('O conteúdo precisa ser um objeto JSON.');
              if(String(dados.disciplina||'').trim().toLowerCase()!==String(disciplina.nome||'').trim().toLowerCase()) throw new Error('A disciplina do JSON não corresponde a este cartão.');
              if(dados.periodo!==periodo) throw new Error('O período do JSON não corresponde ao período informado ('+periodo+').');
              if(!['atividades_encontradas','nenhuma_atividade_identificada','informacoes_insuficientes'].includes(dados.status_extracao)) throw new Error('status_extracao possui um valor não reconhecido.');
              if(!Array.isArray(dados.atividades)) throw new Error('O campo atividades precisa ser uma lista.');
              if(dados.status_extracao==='atividades_encontradas'&&dados.atividades.length===0) throw new Error('O status indica atividades encontradas, mas a lista está vazia.');
              if(dados.status_extracao==='nenhuma_atividade_identificada'&&dados.atividades.length!==0) throw new Error('Quando nenhuma atividade for identificada, a lista atividades deve estar vazia.');
              const tiposPermitidos=['prova','trabalho','seminario','entrega','outro'];
              dados.atividades.forEach((atividade,indice)=>{
                if(!atividade||typeof atividade!=='object'||Array.isArray(atividade)) throw new Error('Atividade '+(indice+1)+' inválida.');
                if(!tiposPermitidos.includes(atividade.tipo)) throw new Error('Tipo inválido na atividade '+(indice+1)+'.');
                if(!String(atividade.titulo||'').trim()) throw new Error('Informe o título da atividade '+(indice+1)+'.');
                if(atividade.data!==null&&(typeof atividade.data!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(atividade.data)||Number.isNaN(Date.parse(atividade.data+'T00:00:00')))) throw new Error('Data inválida na atividade '+(indice+1)+'. Use AAAA-MM-DD ou null.');
              });
              if(dados.status_extracao==='informacoes_insuficientes') throw new Error('As fontes não forneceram informações suficientes. O cronograma não será gravado.');
              dadosValidados={
                disciplina:disciplina.nome,periodo,
                status_extracao:dados.status_extracao,
                atividades:dados.atividades.map(atividade=>({tipo:atividade.tipo,titulo:String(atividade.titulo).trim(),data:atividade.data,observacao:String(atividade.observacao||'').trim()})),
                observacoes_gerais:String(dados.observacoes_gerais||'').trim()
              };
              resultadoValidacao.classList.add('sucesso');
              resultadoValidacao.textContent='JSON válido. '+dados.atividades.length+' atividade(s) identificada(s) para '+disciplina.nome+' — '+periodo+'. Confira os dados antes de continuar.';
              botaoEnviar.hidden=false;
            }catch(erro){resultadoValidacao.classList.add('erro');resultadoValidacao.textContent='Não foi possível validar: '+erro.message;}
          });

          botaoEnviar.addEventListener('click',()=>{
            if(!dadosValidados||!ofertaAlvo)return;
            const corpo=[
              '### Oferta',ofertaAlvo.id,'',
              '### Disciplina ID',disciplina.id,'',
              '### Disciplina',disciplina.nome,'',
              '### Período letivo',ofertaAlvo.periodo,'',
              '### JSON do cronograma','```json',
              JSON.stringify(dadosValidados,null,2),'```'
            ].join('\n');
            const url=new URL('https://github.com/ricardofelippe/Direito-UFPR/issues/new');
            url.searchParams.set('template','importar-cronograma.md');
            url.searchParams.set('title','[Importar cronograma] '+disciplina.nome+' — '+ofertaAlvo.periodo);
            url.searchParams.set('body',corpo);
            window.open(url.toString(),'_blank','noopener');
          });
          importacao.append(rotuloPeriodo,campoPeriodo,rotuloJson,campoJson,botaoValidar,botaoEnviar,resultadoValidacao);
          corpoCronograma.appendChild(importacao);
          painelCronograma.appendChild(corpoCronograma);
          conteudo.appendChild(painelCronograma);
        }

        if (possuiFicha) {
          const painelFicha = criarElemento('details', 'ficha-pedagogica');
          painelFicha.appendChild(criarElemento('summary', '', ficha.fonte_titulo ? 'Informações pedagógicas · UFPR' : 'Informações pedagógicas'));
          const corpoFicha = criarElemento('div', 'ficha-pedagogica-conteudo');
          const camposFicha = [
            ['ementa', 'Ementa'],
            ['programa', 'Programa da disciplina'],
            ['objetivo_geral', 'Objetivo geral'],
            ['objetivos_especificos', 'Objetivos específicos'],
            ['procedimentos_didaticos', 'Procedimentos didáticos'],
            ['formas_avaliacao', 'Formas de avaliação'],
            ['bibliografia_basica', 'Bibliografia básica'],
            ['bibliografia_complementar', 'Bibliografia complementar'],
            ['observacao', 'Observação sobre o documento']
          ];
          camposFicha.forEach(([chave, rotulo]) => {
            if (!ficha[chave]) return;
            const campo = criarElemento('details', 'ficha-campo');
            campo.appendChild(criarElemento('summary', '', rotulo));
            campo.appendChild(criarElemento('p', '', ficha[chave]));
            corpoFicha.appendChild(campo);
          });
          if (ficha.fonte) {
            const fonte = criarElemento('a', 'ficha-fonte', 'Consultar ficha original da UFPR ↗');
            fonte.href = ficha.fonte;
            fonte.target = '_blank';
            fonte.rel = 'noopener noreferrer';
            corpoFicha.appendChild(fonte);
          }
          painelFicha.appendChild(corpoFicha);
          conteudo.appendChild(painelFicha);
        }

        const painelProgresso = criarElemento('div', 'painel-progresso-disciplina');
        painelProgresso.appendChild(criarElemento(
          'div',
          'distribuicao-situacao',
          `Assuntos: ${progressoDisciplina.total} · Não iniciados: ${progressoDisciplina.situacoes.nao_iniciado} · Em andamento: ${progressoDisciplina.situacoes.em_andamento} · Concluídos: ${progressoDisciplina.situacoes.concluido} · Pendentes: ${progressoDisciplina.situacoes.pendente}`
        ));
        adicionarIndicadorPercentual(painelProgresso, 'Conteúdo estudado', progressoDisciplina.conteudo);
        conteudo.appendChild(painelProgresso);

        // Todas as categorias curriculares usam o mesmo ambiente de estudos.
        // A identificação da disciplina é feita exclusivamente pelo ID estável.
        const linkAcesso = criarElemento('a', 'indicador-acesso', 'Abrir ambiente de estudos →');
        const parametrosAcesso = new URLSearchParams({ id: disciplina.id });
        linkAcesso.href = 'disciplina.html?' + parametrosAcesso.toString();
        linkAcesso.setAttribute('aria-label', 'Abrir ambiente de estudos da disciplina ' +
          (disciplina.codigo ? disciplina.codigo + ' — ' : '') + (disciplina.nome || ''));
        linkAcesso.title = 'Abre a página de estudos com as seções de resumos, revisões, questões, flashcards, fluxogramas e materiais.';
        conteudo.appendChild(linkAcesso);
        cartao.appendChild(conteudo);
        wrapper.appendChild(cartao);

        const controleStatus = criarElemento('div', 'controle-status-disciplina');
        const seletorStatus = criarElemento('select', 'seletor-status-disciplina');
        seletorStatus.setAttribute('aria-label', 'Novo status administrativo de ' + (disciplina.nome || 'disciplina'));
        seletorStatus.add(new Option('Selecionar novo status', ''));
        [
          ['ativa', 'Ativa'],
          ['inativa', 'Inativa'],
          ['pendente', 'Pendente'],
          ['finalizada', 'Finalizada']
        ].forEach(([valor, rotulo]) => {
          if (valor !== status) seletorStatus.add(new Option(rotulo, valor));
        });

        const acao = criarElemento('a', 'acao-status-disciplina', 'Solicitar alteração');
        acao.hidden = true;
        acao.target = '_blank';
        acao.rel = 'noopener';
        acao.setAttribute('aria-label', 'Solicitar alteração do status administrativo de ' + (disciplina.nome || 'disciplina'));

        seletorStatus.addEventListener('change', () => {
          if (!seletorStatus.value) {
            acao.hidden = true;
            acao.removeAttribute('href');
            return;
          }
          const corpo = [
            '### Identificador da disciplina',
            disciplina.id,
            '',
            '### Novo status',
            seletorStatus.value
          ].join('\n');
          const parametros = new URLSearchParams({
            template: 'atualizar-status-disciplina.md',
            title: '[Atualizar status da disciplina] ' + (disciplina.codigo || disciplina.id),
            body: corpo
          });
          acao.href = 'https://github.com/ricardofelippe/direito-ufpr/issues/new?' + parametros.toString();
          acao.hidden = false;
        });

        controleStatus.appendChild(seletorStatus);
        controleStatus.appendChild(acao);
        wrapper.appendChild(controleStatus);

        return wrapper;
      }

      function criarGrupo(titulo, registros) {
        if (!registros.length) return null;

        const grupo = criarElemento('section', 'grupo-categoria');
        grupo.appendChild(criarElemento('h3', 'titulo-categoria', titulo));
        const grade = criarElemento('div', 'grade-disciplinas');
        ordenarRegistros(registros).forEach(registro => grade.appendChild(criarCartao(registro)));
        grupo.appendChild(grade);
        return grupo;
      }

      function criarPrevisaoTopicas(previsao) {
        const dados = previsao.find(item => Number(item.ano) === Number(anoAtual));
        if (!dados) return null;

        const grupo = criarElemento('section', 'grupo-categoria');
        grupo.appendChild(criarElemento('h3', 'titulo-categoria', 'Disciplinas tópicas'));

        const grade = criarElemento('div', 'grade-disciplinas');
        const cartao = criarElemento('div', 'cartao-topico-previsto');

        cartao.appendChild(criarElemento('p', '', 'Os componentes tópicos ainda serão cadastrados. Nenhum nome ou código foi presumido.'));

        const linkTopicas = criarElemento('a', 'link-informacoes-pedagogicas', 'Consultar relação oficial de disciplinas tópicas →');
        linkTopicas.href = 'https://direito.ufpr.br/?page_id=41849';
        linkTopicas.target = '_blank';
        linkTopicas.rel = 'noopener noreferrer';

        const resumo = criarElemento('div', 'resumo-topicas');

        cartao.appendChild(resumo);
        grade.appendChild(cartao);
        grupo.appendChild(grade);

      }

      let anoAtual = 0;

      let filtrosDisciplinasAplicados = {
        administrativo: 'todos',
        inicio: 'todos',
        situacao: 'todos'
      };

      function obterFiltrosDisciplinas() {
        return filtrosDisciplinasAplicados;
      }

      function filtrarDisciplinas(disciplinas) {
        const filtros = obterFiltrosDisciplinas();
        return disciplinas.filter(disciplina => {
          const status = String(disciplina.status || 'pendente').toLowerCase();
          if (filtros.administrativo !== 'todos' && status !== filtros.administrativo) return false;

          const progresso = calcularProgressoDisciplina(disciplina.id);
          const iniciada = progresso.iniciados > 0;
          if (filtros.inicio === 'iniciada' && !iniciada) return false;
          if (filtros.inicio === 'nao-iniciada' && iniciada) return false;

          if (filtros.situacao !== 'todos') {
            if (filtros.situacao === 'nao_iniciado') {
              if (progresso.situacoes.nao_iniciado !== progresso.total) return false;
            } else if (progresso.situacoes[filtros.situacao] === 0) {
              return false;
            }
          }

          if (filtros.revisoes === 'pendentes') {
            const hoje = new Date();
            const dataHoje = [hoje.getFullYear(), String(hoje.getMonth() + 1).padStart(2, '0'), String(hoje.getDate()).padStart(2, '0')].join('-');
            const idsAssuntos = new Set((estruturaAtual.assuntos || [])
              .filter(assunto => assunto.disciplina_id === disciplina.id)
              .map(assunto => assunto.id));
            const possuiRevisaoPendente = registrosProgresso.some(registro =>
              idsAssuntos.has(registro.assunto_id) &&
              registro.data_revisao &&
              registro.data_revisao <= dataHoje &&
              !['concluido', 'nao_se_aplica'].includes(registro.revisao_status)
            );
            if (!possuiRevisaoPendente) return false;
          }
          return true;
        });
      }

      function atualizarResumoFiltros(total) {
        const resumo = document.getElementById('resumo-filtros-disciplinas');
        if (!resumo) return;
        const filtros = obterFiltrosDisciplinas();
        const quantidadeAtivos = Object.values(filtros).filter(valor => valor !== 'todos').length;
        const ativos = quantidadeAtivos > 0;
        resumo.textContent = ativos
          ? `Exibindo ${total} disciplina(s) conforme os filtros selecionados.`
          : 'Exibindo todas as disciplinas.';
        const indicador = document.getElementById('indicador-filtros-ativos');
        if (indicador) {
          indicador.hidden = !ativos;
          indicador.textContent = ativos ? (quantidadeAtivos + (quantidadeAtivos === 1 ? ' ativo' : ' ativos')) : '';
        }
      }

      function configurarFiltrosDisciplinas() {
        const ids = [
          'filtro-status-administrativo',
          'filtro-inicio-estudos',
          'filtro-situacao-geral'
        ];

        const parametros = new URLSearchParams(window.location.search);
        const administrativo = parametros.get('filtroAdministrativo');
        const situacao = parametros.get('filtroSituacao');
        const revisoes = parametros.get('filtroRevisoes');
        filtrosDisciplinasAplicados = {
          administrativo: ['ativa', 'inativa', 'pendente'].includes(administrativo) ? administrativo : 'todos',
          inicio: 'todos',
          situacao: ['em_andamento', 'concluido', 'pendente', 'nao_iniciado'].includes(situacao) ? situacao : 'todos',
          revisoes: revisoes === 'pendentes' ? 'pendentes' : 'todos'
        };

        document.getElementById('filtro-status-administrativo').value = filtrosDisciplinasAplicados.administrativo;
        document.getElementById('filtro-situacao-geral').value = filtrosDisciplinasAplicados.situacao;
        if (Object.values(filtrosDisciplinasAplicados).some(valor => valor !== 'todos')) {
          document.querySelector('.painel-filtros-disciplinas')?.setAttribute('open', '');
        }

        document.getElementById('aplicar-filtros-disciplinas')?.addEventListener('click', () => {
          filtrosDisciplinasAplicados = {
            administrativo: document.getElementById('filtro-status-administrativo')?.value || 'todos',
            inicio: document.getElementById('filtro-inicio-estudos')?.value || 'todos',
            situacao: document.getElementById('filtro-situacao-geral')?.value || 'todos',
            revisoes: 'todos'
          };
          if (estruturaAtual) renderizar(estruturaAtual);
        });

        document.getElementById('limpar-filtros-disciplinas')?.addEventListener('click', () => {
          ids.forEach(id => {
            const controle = document.getElementById(id);
            if (controle) controle.value = 'todos';
          });
          filtrosDisciplinasAplicados = {
            administrativo: 'todos',
            inicio: 'todos',
            situacao: 'todos',
            revisoes: 'todos'
          };
          if (estruturaAtual) renderizar(estruturaAtual);
        });
      }

      function renderizar(estrutura) {
        estruturaAtual = estrutura;
        if (!estrutura || !Array.isArray(estrutura.disciplinas)) {
          throw new Error('O arquivo não contém uma lista válida de disciplinas.');
        }

        const disciplinas = filtrarDisciplinas(estrutura.disciplinas);

        // A numeração acompanha a posição visual efetiva dos cartões.
        // O numerador é sequencial entre os registros exibidos; o denominador
        // continua sendo o total completo da categoria (ex.: 01/51).
        const gruposNumeracao = new Map();
        disciplinas.forEach(disciplina => {
          const categoria = disciplina.categoria || 'sem-categoria';
          if (!gruposNumeracao.has(categoria)) gruposNumeracao.set(categoria, []);
          gruposNumeracao.get(categoria).push(disciplina);
        });
        indicadoresOrdemDisciplinas = new Map();
        gruposNumeracao.forEach((registros, categoria) => {
          const totalCategoria = estrutura.disciplinas.filter(
            disciplina => (disciplina.categoria || 'sem-categoria') === categoria
          ).length;
          const ordenados = [...registros].sort((a, b) => {
            const anoA = a.ano == null || a.ano === '' ? 6 :
              (Number(a.ano) >= 1 && Number(a.ano) <= 5 ? Number(a.ano) : 7 + Number(a.ano || 0));
            const anoB = b.ano == null || b.ano === '' ? 6 :
              (Number(b.ano) >= 1 && Number(b.ano) <= 5 ? Number(b.ano) : 7 + Number(b.ano || 0));
            if (anoA !== anoB) return anoA - anoB;
            const prioridadeA = String(a.status || 'pendente').toLowerCase() === 'ativa' ? 0 : 1;
            const prioridadeB = String(b.status || 'pendente').toLowerCase() === 'ativa' ? 0 : 1;
            return prioridadeA - prioridadeB || compararOrdemCurricular(a, b);
          });
          ordenados.forEach((disciplina, indice) => {
            const numero = String(indice + 1).padStart(2, '0');
            const total = String(totalCategoria).padStart(2, '0');
            const unidadesDisciplina = new Set(
              (estrutura.unidades || [])
                .filter(unidade => unidade.disciplina_id === disciplina.id)
                .map(unidade => unidade.id)
            );
            const totalAssuntos = (estrutura.assuntos || []).filter(assunto =>
              assunto.disciplina_id === disciplina.id || unidadesDisciplina.has(assunto.unidade_id)
            ).length;
            const rotuloAssuntos = totalAssuntos === 1 ? 'assunto' : 'assuntos';
            indicadoresOrdemDisciplinas.set(disciplina.id, {
              texto: numero + '/' + total + ' — ' + totalAssuntos + ' ' + rotuloAssuntos,
              ariaLabel: 'Posição visual ' + (indice + 1) + ' de ' + totalCategoria + ' na categoria ' + categoria + ', com ' + totalAssuntos + ' ' + rotuloAssuntos
            });
          });
        });

        const fragmento = document.createDocumentFragment();
        const anos = [1, 2, 3, 4, 5];

        anos.forEach(ano => {
          anoAtual = ano;
          const registrosAno = disciplinas.filter(item => Number(item.ano) === ano);
          const secao = criarElemento('details', 'ano-curriculo');
          secao.appendChild(criarElemento('summary', 'titulo-ano'));
          const titulo = secao.querySelector('.titulo-ano');
          titulo.appendChild(criarElemento('span', 'numero-ano', String(ano)));
          titulo.appendChild(document.createTextNode(`${ano}º Ano`));

          // Os quantitativos vêm da estrutura curricular completa, sem sofrer
          // alteração quando filtros de situação ou status estiverem ativos.
          const obrigatoriasDoAno = estrutura.disciplinas.filter(item =>
            Number(item.ano) === ano && item.categoria === 'obrigatoria'
          ).length;
          const previsaoTopicaAno = (estrutura.previsao_topicas || [])
            .find(item => Number(item.ano) === ano);
          const resumoContagens = criarElemento('span', 'resumo-contagens-ano');
          resumoContagens.appendChild(criarElemento('span', '', `${obrigatoriasDoAno} obrigatórias`));
          resumoContagens.appendChild(criarElemento('span', 'separador-contagens', '·'));
          resumoContagens.appendChild(criarElemento('span', '',
            previsaoTopicaAno
              ? `${previsaoTopicaAno.quantidade} tópicas sugeridas`
              : 'sem tópicas previstas'
          ));
          titulo.appendChild(resumoContagens);

          ordemCategorias.forEach(categoria => {
            const registros = registrosAno.filter(item => item.categoria === categoria);
            const grupo = criarGrupo(categorias[categoria] || categoria, registros);
            if (grupo) secao.appendChild(grupo);
          });

          const topicas = criarPrevisaoTopicas(Array.isArray(estrutura.previsao_topicas) ? estrutura.previsao_topicas : []);
          if (topicas && (registrosAno.length || disciplinas.length === 0)) secao.appendChild(topicas);

          if (registrosAno.length || (topicas && disciplinas.length === 0)) fragmento.appendChild(secao);
        });

        const semAno = disciplinas.filter(item => item.ano === null || item.ano === undefined || item.ano === '');
        if (semAno.length) {
          const secao = criarElemento('details', 'secao-sem-ano');
          secao.appendChild(criarElemento('summary', 'titulo-sem-ano', 'Atividades e disciplinas sem ano definido'));
          const conteudoSecao = criarElemento('div', 'conteudo-secao-sem-ano');
          ordemCategorias.forEach(categoria => {
            const registros = semAno.filter(item => item.categoria === categoria);
            const grupo = criarGrupo(categorias[categoria] || categoria, registros);
            if (grupo) conteudoSecao.appendChild(grupo);
          });

          const categoriasDesconhecidas = [...new Set(semAno.map(item => item.categoria).filter(cat => !ordemCategorias.includes(cat)))];
          categoriasDesconhecidas.forEach(categoria => {
            const grupo = criarGrupo(categorias[categoria] || categoria, semAno.filter(item => item.categoria === categoria));
            if (grupo) conteudoSecao.appendChild(grupo);
          });
          secao.appendChild(conteudoSecao);
          fragmento.appendChild(secao);
        }

        const anosExtras = disciplinas.filter(item => item.ano != null && !anos.includes(Number(item.ano)));
        if (anosExtras.length) {
          const secao = criarElemento('details', 'secao-sem-ano');
          secao.appendChild(criarElemento('summary', 'titulo-sem-ano', 'Outros registros curriculares'));
          const conteudoSecao = criarElemento('div', 'conteudo-secao-sem-ano');
          ordemCategorias.forEach(categoria => {
            const grupo = criarGrupo(categorias[categoria] || categoria, anosExtras.filter(item => item.categoria === categoria));
            if (grupo) conteudoSecao.appendChild(grupo);
          });
          secao.appendChild(conteudoSecao);
          fragmento.appendChild(secao);
        }

        atualizarResumoFiltros(disciplinas.length);
        if (!fragmento.childNodes.length) {
          elementoCurriculo.replaceChildren(criarElemento('p', 'estado-vazio', 'Nenhuma disciplina corresponde aos filtros selecionados.'));
          return;
        }

        elementoCurriculo.replaceChildren(fragmento);
      }

      function normalizarTexto(valor) {
        return String(valor || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLocaleLowerCase('pt-BR')
          .trim();
      }

      function configurarBusca(estrutura) {
        const campo = document.getElementById('campo-busca-curriculo');
        const resultados = document.getElementById('resultados-busca-curriculo');
        const filtros = document.getElementById('filtros-busca-curriculo');
        const botaoBuscar = document.getElementById('aplicar-busca-curriculo');
        const botaoLimpar = document.getElementById('limpar-busca-curriculo');

        let filtroAtivo = 'todos';
        const disciplinas = Array.isArray(estrutura.disciplinas) ? estrutura.disciplinas : [];
        const unidades = Array.isArray(estrutura.unidades) ? estrutura.unidades : [];
        const assuntos = Array.isArray(estrutura.assuntos) ? estrutura.assuntos : [];

        function adicionarResultado(tipo, nome, contexto, disciplinaId, categoria, assuntoId = null) {
          if (!disciplinaId) return;
          const link = criarElemento('a', 'resultado-busca-curriculo');
          link.dataset.categoria = categoria;
          const parametros = new URLSearchParams({ id: disciplinaId });
          if (assuntoId) parametros.set('assunto', assuntoId);
          link.href = 'disciplina.html?' + parametros.toString();
          link.appendChild(criarElemento('span', 'tipo-resultado-busca', tipo));
          link.appendChild(criarElemento('span', 'nome-resultado-busca', nome));
          if (contexto) link.appendChild(criarElemento('span', 'contexto-resultado-busca', contexto));
          resultados.appendChild(link);
        }

        function aplicarFiltroResultados() {
          const itens = resultados.querySelectorAll('.resultado-busca-curriculo');
          let visiveis = 0;
          itens.forEach(item => {
            item.hidden = filtroAtivo !== 'todos' && item.dataset.categoria !== filtroAtivo;
            if (!item.hidden) visiveis++;
          });
          filtros.querySelectorAll('[data-filtro]').forEach(botao => {
            botao.setAttribute('aria-pressed', String(botao.dataset.filtro === filtroAtivo));
          });
          const mensagemFiltro = resultados.querySelector('.mensagem-filtro-busca');
          if (mensagemFiltro) mensagemFiltro.remove();
          if (filtroAtivo !== 'todos' && itens.length && !visiveis) {
            resultados.appendChild(criarElemento('p', 'mensagem-busca-curriculo mensagem-filtro-busca',
              'Nenhum resultado encontrado neste tipo.'));
          }
        }

        function pesquisar() {
          const termoOriginal = campo.value.trim();
          const termo = normalizarTexto(termoOriginal);
          resultados.replaceChildren();
          filtros.hidden = !termo;
          if (!termo) return;

          let quantidade = 0;
          const limite = 100;
          const adicionarSeCorresponder = (texto, callback) => {
            if (quantidade >= limite || !normalizarTexto(texto).includes(termo)) return;
            callback();
            quantidade++;
          };

          disciplinas.forEach(disciplina => {
            adicionarSeCorresponder(
              [disciplina.nome, disciplina.codigo, disciplina.descricao].filter(Boolean).join(' '),
              () => adicionarResultado(
                disciplina.codigo ? 'Disciplina · ' + disciplina.codigo : 'Disciplina',
                disciplina.nome || 'Disciplina sem nome',
                disciplina.ano ? disciplina.ano + 'º ano' : 'Ano não informado',
                disciplina.id,
                'disciplina'
              )
            );
          });

          unidades.forEach(unidade => {
            const disciplina = disciplinas.find(item => item.id === unidade.disciplina_id);
            if (!disciplina) return;
            adicionarSeCorresponder(
              [unidade.nome, unidade.titulo, unidade.descricao].filter(Boolean).join(' '),
              () => adicionarResultado('Unidade temática', unidade.nome || unidade.titulo || 'Unidade sem nome',
                'Disciplina: ' + disciplina.nome, disciplina.id, 'unidade')
            );
          });

          assuntos.forEach(assunto => {
            const unidade = unidades.find(item => item.id === assunto.unidade_id);
            const disciplinaId = assunto.disciplina_id || (unidade && unidade.disciplina_id);
            const disciplina = disciplinas.find(item => item.id === disciplinaId);
            if (!disciplina) return;
            adicionarSeCorresponder(
              [assunto.nome, assunto.titulo, assunto.descricao].filter(Boolean).join(' '),
              () => {
                const contexto = unidade
                  ? 'Disciplina: ' + disciplina.nome + ' · Unidade: ' + (unidade.nome || unidade.titulo || 'Sem título')
                  : 'Disciplina: ' + disciplina.nome;
                adicionarResultado('Assunto', assunto.nome || assunto.titulo || 'Assunto sem nome',
                  contexto, disciplina.id, 'assunto', assunto.id);
              }
            );
          });

          if (!quantidade) {
            resultados.appendChild(criarElemento('p', 'mensagem-busca-curriculo',
              'Nenhum resultado encontrado para “' + termoOriginal + '”.'));
          } else if (quantidade >= limite) {
            resultados.appendChild(criarElemento('p', 'mensagem-busca-curriculo',
              'Exibindo os primeiros ' + limite + ' resultados. Refine a busca para encontrar outros registros.'));
          }
          aplicarFiltroResultados();
        }

        filtros.querySelectorAll('[data-filtro]').forEach(botao => {
          botao.addEventListener('click', () => {
            filtroAtivo = botao.dataset.filtro || 'todos';
            aplicarFiltroResultados();
          });
        });

        botaoBuscar?.addEventListener('click', pesquisar);
        campo.addEventListener('input', () => {
          filtroAtivo = 'todos';
          pesquisar();
        });
        campo.addEventListener('keydown', evento => {
          if (evento.key === 'Enter') {
            evento.preventDefault();
            pesquisar();
          }
        });
        botaoLimpar?.addEventListener('click', () => {
          campo.value = '';
          filtroAtivo = 'todos';
          pesquisar();
          campo.focus();
        });
      }

      async function carregarEstrutura() {
        elementoCurriculo.replaceChildren(criarElemento('p', 'estado-carregamento', 'Carregando estrutura curricular...'));
        try {
          // Carrega os três arquivos em paralelo e limita o tempo de espera.
          // Assim, uma requisição pendente não deixa a página presa indefinidamente.
          const opcoesFetch = { cache: 'no-store', signal: AbortSignal.timeout(15000) };
          const [resposta, respostaProgresso, respostaOfertas] = await Promise.all([
            fetch(URL_ESTRUTURA, opcoesFetch),
            fetch('./dados/progresso.json', opcoesFetch),
            fetch('./dados/ofertas.json', opcoesFetch)
          ]);

          if (!resposta.ok) {
            throw new Error(`Não foi possível carregar dados/estrutura.json (HTTP ${resposta.status}).`);
          }
          const estrutura = await resposta.json();

          if (respostaProgresso.ok) {
            const dadosProgresso = await respostaProgresso.json();
            registrosProgresso = Array.isArray(dadosProgresso.progresso) ? dadosProgresso.progresso : [];
          } else {
            registrosProgresso = [];
          }

          if (respostaOfertas.ok) {
            const dadosOfertas = await respostaOfertas.json();
            ofertas = Array.isArray(dadosOfertas.ofertas) ? dadosOfertas.ofertas : [];
          } else {
            ofertas = [];
          }
          configurarBusca(estrutura);
          configurarFiltrosDisciplinas();
          renderizar(estrutura);
        } catch (erro) {
          console.error('Erro ao carregar o currículo:', erro);
          const aviso = criarElemento('div', 'estado-erro');
          aviso.appendChild(criarElemento('p', '', 'Não foi possível carregar o currículo. Verifique se dados/estrutura.json está publicado no repositório.'));
          aviso.appendChild(criarElemento('p', '', erro.message || 'Ocorreu um erro inesperado.'));
          const botao = criarElemento('button', 'botao-tentar-novamente', 'Tentar novamente');
          botao.type = 'button';
          botao.addEventListener('click', carregarEstrutura);
          aviso.appendChild(botao);
          elementoCurriculo.replaceChildren(aviso);
        }
      }

      carregarEstrutura();
    })();
  </script>
