
name: Cadastrar material
description: Enviar um novo material para a Biblioteca de Direito
title: "[Cadastro de material] "
body:
  - type: input
    id: titulo
    attributes:
      label: Título do material
      placeholder: Ex. Introdução à Teoria do Direito
    validations:
      required: true

  - type: input
    id: disciplina
    attributes:
      label: Disciplina
      placeholder: Teoria do Direito
    validations:
      required: true

  - type: input
    id: disciplina_id
    attributes:
      label: ID da disciplina
      description: Identificador interno para vincular o material à disciplina correta.
      placeholder: ID preenchido automaticamente pelo cadastro do site
    validations:
      required: false

  - type: input
    id: assunto
    attributes:
      label: Assunto vinculado
      description: Opcional. Informe o assunto selecionado no cadastro do site.
      placeholder: Nome do assunto
    validations:
      required: false

  - type: input
    id: id_assunto
    attributes:
      label: ID do assunto
      description: Identificador interno para vincular o material ao assunto correto.
      placeholder: ID preenchido automaticamente pelo cadastro do site
    validations:
      required: false

  - type: input
    id: categoria
    attributes:
      label: Categoria
      placeholder: Texto de estudo
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      placeholder: Explique brevemente o conteúdo do material.
    validations:
      required: false

  - type: input
    id: arquivo
    attributes:
      label: Caminho do PDF
      placeholder: documentos/teoria-do-direito/material.pdf
      description: Informe o caminho do PDF já enviado ao repositório.
    validations:
      required: false

