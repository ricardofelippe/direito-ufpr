name: Atualizar progresso de estudo
description: Registrar ou atualizar os indicadores de um assunto
title: "[Atualizar progresso] "
labels:
  - progresso-estudos
assignees:
  - ricardofelippe
body:
  - type: input
    id: assunto_id
    attributes:
      label: ID do assunto
      description: Identificador existente em dados/estrutura.json
      placeholder: teoria-do-direito-assunto-01
    validations:
      required: true

  - type: dropdown
    id: situacao_geral
    attributes:
      label: Situação geral
      options:
        - nao_iniciado
        - em_andamento
        - concluido
        - pendente
    validations:
      required: true

  - type: dropdown
    id: conteudo_status
    attributes:
      label: Conteúdo estudado
      options:
        - nao_iniciado
        - em_andamento
        - estudado
    validations:
      required: true

  - type: dropdown
    id: questoes_status
    attributes:
      label: Questões praticadas
      options:
        - nao_iniciado
        - em_andamento
        - concluido
        - nao_se_aplica
    validations:
      required: true

  - type: dropdown
    id: revisao_status
    attributes:
      label: Revisões realizadas
      options:
        - nao_iniciado
        - em_andamento
        - concluido
        - nao_se_aplica
    validations:
      required: true
