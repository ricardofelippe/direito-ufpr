
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca de Direito</title>
  <link rel="stylesheet" href="direito.css?v=3">
  <style>

    /* Cartões compactos e expansíveis */
    body.pagina-biblioteca .documento {
      padding: 0;
      overflow: hidden;
      align-self: start;
    }
    body.pagina-biblioteca .documento:hover {
      transform: none;
    }
    body.pagina-biblioteca .documento-resumo {
      position: relative;
      display: block;
      cursor: pointer;
      list-style: none;
      padding: 17px 42px 17px 18px;
      min-height: 100px;
    }
    body.pagina-biblioteca .documento-resumo::-webkit-details-marker {
      display: none;
    }
    body.pagina-biblioteca .documento-resumo::after {
      content: "+";
      position: absolute;
      right: 18px;
      top: 18px;
      color: #36d9dc;
      font: 22px Arial, sans-serif;
    }
    body.pagina-biblioteca details[open] > .documento-resumo::after {
      content: "−";
    }
    body.pagina-biblioteca .documento-resumo h3 {
      margin: 0 0 9px;
      font-size: 17px;
      line-height: 1.35;
    }
    body.pagina-biblioteca .documento-resumo p {
      margin: 4px 0 0;
      color: #a5b8ca;
      font-size: 12px;
    }
    body.pagina-biblioteca .documento-categoria {
      color: #71869b !important;
    }
    body.pagina-biblioteca .documento-conteudo {
      padding: 0 18px 18px;
      border-top: 1px solid #1b3041;
    }
    body.pagina-biblioteca .documento-conteudo > p:first-child {
      margin-top: 14px;
    }

    body.pagina-biblioteca > header.cabecalho-biblioteca {
      padding: 24px max(24px, calc((100% - 1120px) / 2));
      text-align: left;
      background: #0c1420;
    }
    .cabecalho-conteudo {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .cabecalho-biblioteca .sobretitulo {
      margin: 0 0 5px;
      color: #19c7ce;
      font: 11px Arial, sans-serif;
      letter-spacing: .13em;
    }
    body.pagina-biblioteca > header h1 {
      margin: 0;
      font: 700 25px Georgia, serif;
      letter-spacing: 0;
    }
    body.pagina-biblioteca > header p:last-child {
      margin: 5px 0 0;
    }
    .navegacao-biblioteca {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .navegacao-biblioteca a {
      display: inline-block;
      padding: 9px 12px;
      border: 1px solid #263b50;
      border-radius: 5px;
      color: #e6edf5;
      font: 13px Arial, sans-serif;
      text-decoration: none;
    }
    .navegacao-biblioteca a:hover {
      border-color: #19c7ce;
      color: #36d9dc;
    }
    body.pagina-biblioteca .conteudo-principal {
      max-width: 1120px;
      margin: 34px auto;
      padding: 0 24px 48px;
    }
    .controles-biblioteca {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .controles-biblioteca #busca {
      flex: 1 1 340px;
      width: auto;
      max-width: none;
    }
    @media(max-width:700px) {
      .cabecalho-conteudo { align-items:flex-start; flex-direction:column; }
      body.pagina-biblioteca > header.cabecalho-biblioteca { padding:22px 18px; }
      body.pagina-biblioteca .conteudo-principal { padding:0 16px 36px; margin:24px auto; }
      .controles-biblioteca #busca { flex-basis:100%; }
    }
  </style>

</head>

<body class="pagina-biblioteca">

  <header class="cabecalho-biblioteca">
    <div class="cabecalho-conteudo">
      <div>
        <p class="sobretitulo">DIREITO · UNIVERSIDADE FEDERAL DO PARANÁ</p>
        <h1>Biblioteca geral</h1>
        <p>Catálogo de materiais de todas as disciplinas</p>
      </div>
      <nav class="navegacao-biblioteca" aria-label="Navegação principal">
        <a href="index.html">⌂ Painel inicial</a>
        <a href="direito.html">← Currículo</a>
      </nav>
    </div>
  </header>

  <main id="inicio" class="conteudo-principal">

        <h2>Todos os documentos</h2>

        <!-- PESQUISA -->
        <div class="controles-biblioteca">
        <input
          type="search"
          id="busca"
          placeholder="Buscar por título, descrição ou palavra-chave..."
          aria-label="Buscar materiais"
        >

        <select id="filtro-disciplina">
          <option value="">Todas as disciplinas</option>
        </select>

        <select id="filtro-categoria" aria-label="Filtrar por categoria">
          <option value="">Todas as categorias</option>
        </select>
        </div>

        <!-- INDICADORES -->
        <div
          id="resumo-biblioteca"
          class="resumo-biblioteca">
        </div>

        <!-- ESTADO DA BIBLIOTECA -->
        <p id="estado" role="status">
          Carregando documentos...
        </p>

        <!-- LISTA DE MATERIAIS -->
        <section
          id="lista-documentos"
          class="lista-documentos">
        </section>

  </main>

  <script>

    async function carregarBiblioteca() {

      const busca = document.getElementById("busca");

      const filtroDisciplina =
        document.getElementById("filtro-disciplina");

      const filtroCategoria =
        document.getElementById("filtro-categoria");

      const lista =
        document.getElementById("lista-documentos");

      const estado =
        document.getElementById("estado");

      try {

        const [resposta, respostaEstrutura] = await Promise.all([
          fetch("./documentos.json"),
          fetch("./dados/estrutura.json")
        ]);

        if (!resposta.ok || !respostaEstrutura.ok) {
          throw new Error("Erro ao carregar os dados da biblioteca ou do currículo.");
        }

        const [todosDocumentos, estrutura] = await Promise.all([
          resposta.json(),
          respostaEstrutura.json()
        ]);

        // A Biblioteca geral exibe somente disciplinas obrigatórias
        // cadastradas na estrutura curricular oficial.
        const disciplinasObrigatorias = (estrutura.disciplinas || [])
          .filter(d => String(d.categoria || "").toLowerCase() === "obrigatoria");

        const normalizar = valor => String(valor || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLocaleLowerCase("pt-BR")
          .trim();

        const mapaDisciplinas = new Map(
          disciplinasObrigatorias.map(d => [normalizar(d.nome), d])
        );

        const titulosOcultos = new Set([
          "teste de associacao de pdf",
          "teste",
          "teste de integracao do formulario",
          "trabalho 1 - google docs"
        ]);

        const documentos = todosDocumentos.filter(doc => {
          const titulo = normalizar(doc.titulo);
          const categoria = normalizar(doc.categoria);

          // Oculta o cadastro duplicado classificado incorretamente como exercício.
          const resumoDuplicadoComCategoriaIncorreta =
            titulo === "resumo sobre introducao a teoria do direito" &&
            categoria === "exercicio";

          return mapaDisciplinas.has(normalizar(doc.disciplina)) &&
            !titulosOcultos.has(titulo) &&
            !resumoDuplicadoComCategoriaIncorreta;
        });

        const nomeComCodigo = nome => {
          const disciplina = mapaDisciplinas.get(normalizar(nome));
          return disciplina ? disciplina.codigo + " — " + disciplina.nome : nome;
        };

        // =====================================
        // INDICADORES DA BIBLIOTECA
        // =====================================

        function atualizarResumo() {

          const totalMateriais = documentos.length;

          const totalPDFs = documentos.reduce((total, doc) => {

            const arquivos = [
              ...(Array.isArray(doc.arquivos) ? doc.arquivos : []),
              doc.arquivo
            ].filter(Boolean);

            return total + new Set(arquivos).size;

          }, 0);

          const totalDisciplinas = new Set(
            documentos.map(doc => doc.disciplina).filter(Boolean)
          ).size;

          const resumo =
            document.getElementById("resumo-biblioteca");

          resumo.replaceChildren();

          const indicadores = [
            {
              numero: totalMateriais,
              descricao: "Materiais cadastrados",
              icone: "📚"
            },
            {
              numero: totalPDFs,
              descricao: "Arquivos PDF",
              icone: "📄"
            },
            {
              numero: totalDisciplinas,
              descricao: "Disciplinas",
              icone: "🎓"
            }
          ];

          indicadores.forEach(indicador => {

            const cartao = document.createElement("div");
            cartao.className = "indicador-biblioteca";

            const icone = document.createElement("span");
            icone.className = "indicador-icone";
            icone.textContent = indicador.icone;

            const numero = document.createElement("strong");
            numero.className = "indicador-numero";
            numero.textContent = indicador.numero;

            const descricao = document.createElement("span");
            descricao.className = "indicador-descricao";
            descricao.textContent = indicador.descricao;

            cartao.append(icone, numero, descricao);

            resumo.appendChild(cartao);

          });

        }

        atualizarResumo();

        // =====================================
        // IDENTIFICA DISCIPLINAS E CATEGORIAS
        // =====================================

        const disciplinas = [...new Set(
          documentos.map(doc => doc.disciplina).filter(Boolean)
        )].sort((a, b) => nomeComCodigo(a).localeCompare(nomeComCodigo(b), "pt-BR"));

        const categorias = [...new Set(
          documentos.map(doc => doc.categoria).filter(Boolean)
        )].sort();

        // Preenche o filtro de disciplinas

        disciplinas.forEach(nome => {

          const opcao = document.createElement("option");

          opcao.value = nome;
          opcao.textContent = nomeComCodigo(nome);

          filtroDisciplina.appendChild(opcao);

        });

        // Preenche o filtro de categorias

        categorias.forEach(nome => {

          const opcao = document.createElement("option");

          opcao.value = nome;
          opcao.textContent = nome;

          filtroCategoria.appendChild(opcao);

        });

        // =====================================
        // LINK PARA ASSOCIAR PDF
        // =====================================

        function criarLinkAssociacao(texto, doc) {

          const link = document.createElement("a");

          const parametros = new URLSearchParams({
            template: "associar-pdf.yml",
            title: "[Associar PDF] " + doc.titulo,
            titulo: doc.titulo,
            disciplina: doc.disciplina
          });

          link.href =
            "https://github.com/ricardofelippe/direito-ufpr/issues/new?" +
            parametros.toString();

          link.textContent = texto;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          return link;

        }

        // =====================================
        // LINKS PARA GERENCIAR PDFs
        // =====================================

        function criarLinkGerenciamento(
          texto,
          doc,
          operacao,
          arquivo
        ) {

          const parametros = new URLSearchParams({
            template: "gerenciar-pdfs.yml",
            title: "[Gerenciar PDFs] " + doc.titulo,
            titulo: doc.titulo,
            disciplina: doc.disciplina,
            operacao: operacao
          });

          if (arquivo) {
            parametros.set("arquivo_alvo", arquivo);
          }

          const link = document.createElement("a");

          link.href =
            "https://github.com/ricardofelippe/direito-ufpr/issues/new?" +
            parametros.toString();

          link.textContent = texto;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          return link;

        }

        // =====================================
        // EXIBE OS DOCUMENTOS
        // =====================================

        function exibirDocumentos() {

          const termo = busca.value
            .trim()
            .toLocaleLowerCase("pt-BR");

          const disciplina = filtroDisciplina.value;
          const categoria = filtroCategoria.value;

          const filtrados = documentos.filter(doc => {

            const texto = [
              doc.titulo,
              doc.descricao,
              doc.disciplina,
              doc.categoria
            ]
              .filter(Boolean)
              .join(" ")
              .toLocaleLowerCase("pt-BR");

            return texto.includes(termo) &&
              (!disciplina || doc.disciplina === disciplina) &&
              (!categoria || doc.categoria === categoria);

          });

          lista.replaceChildren();

          filtrados.forEach(doc => {

            const artigo = document.createElement("details");
            artigo.className = "documento";

            const resumoCartao = document.createElement("summary");
            resumoCartao.className = "documento-resumo";

            const titulo = document.createElement("h3");
            titulo.textContent = doc.titulo || "Documento sem título";

            const disciplinaTexto = document.createElement("p");
            disciplinaTexto.className = "documento-disciplina";
            disciplinaTexto.textContent =
              nomeComCodigo(doc.disciplina || "Não informada");

            const categoriaTexto = document.createElement("p");
            categoriaTexto.className = "documento-categoria";
            categoriaTexto.textContent =
              doc.categoria || "Categoria não informada";

            resumoCartao.append(titulo, disciplinaTexto, categoriaTexto);
            artigo.appendChild(resumoCartao);

            const conteudoCartao = document.createElement("div");
            conteudoCartao.className = "documento-conteudo";

            const descricao = document.createElement("p");
            descricao.textContent = doc.descricao || "Sem descrição.";
            conteudoCartao.appendChild(descricao);

            // =====================================
            // COMPATIBILIDADE COM PDFs ANTIGOS E NOVOS
            // =====================================

            const arquivos = [
              ...new Set([
                ...(Array.isArray(doc.arquivos) ? doc.arquivos : []),
                doc.arquivo
              ].filter(Boolean))
            ];

            if (arquivos.length > 0) {

              const subtitulo = document.createElement("h4");

              subtitulo.textContent =
                arquivos.length === 1
                  ? "Arquivo PDF:"
                  : "Arquivos PDF (" + arquivos.length + "):";

              conteudoCartao.appendChild(subtitulo);

              const listaArquivos = document.createElement("ul");
              listaArquivos.className = "lista-pdfs";

              arquivos.forEach((caminho, indice) => {

                const item = document.createElement("li");

                const linkAbrir = document.createElement("a");

                linkAbrir.href = caminho;

                linkAbrir.textContent =
                  decodeURIComponent(caminho.split("/").pop()) ||
                  "PDF " + (indice + 1);

                linkAbrir.target = "_blank";
                linkAbrir.rel = "noopener noreferrer";

                item.appendChild(linkAbrir);

                // Ações de gerenciamento

                const acoes = document.createElement("p");
                acoes.className = "acoes-pdf";

                const substituir = criarLinkGerenciamento(
                  "Substituir",
                  doc,
                  "Substituir PDF",
                  caminho
                );

                const remover = criarLinkGerenciamento(
                  "Remover",
                  doc,
                  "Remover PDF",
                  caminho
                );

                acoes.append(substituir, remover);

                item.appendChild(acoes);

                listaArquivos.appendChild(item);

              });

              conteudoCartao.appendChild(listaArquivos);

            } else {

              const aviso = document.createElement("p");

              aviso.textContent = "PDF ainda não anexado.";
              aviso.className = "sem-pdf";

              conteudoCartao.appendChild(aviso);

              conteudoCartao.appendChild(
                criarLinkAssociacao("Associar PDF", doc)
              );

            }

            // =====================================
            // ADICIONAR PDFs
            // =====================================

            if (arquivos.length > 0) {

              const areaAdicionar = document.createElement("p");

              areaAdicionar.appendChild(
                criarLinkGerenciamento(
                  "Adicionar PDFs",
                  doc,
                  "Adicionar PDFs",
                  ""
                )
              );

              conteudoCartao.appendChild(areaAdicionar);

            }

            artigo.appendChild(conteudoCartao);

            lista.appendChild(artigo);

          });

          estado.textContent = filtrados.length
            ? filtrados.length + " material(is) encontrado(s) em disciplinas obrigatórias."
            : "Nenhum material encontrado nas disciplinas obrigatórias.";

        }

        // =====================================
        // LIMPAR FILTROS
        // =====================================

        function limparFiltros(secao) {

          busca.value = "";
          filtroDisciplina.value = "";
          filtroCategoria.value = "";

          exibirDocumentos();

        }

        // =====================================
        // EVENTOS DOS FILTROS
        // =====================================

        busca.addEventListener("input", () => {

          exibirDocumentos();

        });

        filtroDisciplina.addEventListener("change", () => {

          exibirDocumentos();

        });

        filtroCategoria.addEventListener("change", () => {

          exibirDocumentos();

        });

        // =====================================
        // INICIALIZAÇÃO
        // =====================================

        exibirDocumentos();

      } catch (erro) {

        console.error(erro);

        estado.textContent =
          "Erro ao carregar a biblioteca. Verifique documentos.json.";

      }

    }

    carregarBiblioteca();

  </script>

</body>
</html>
