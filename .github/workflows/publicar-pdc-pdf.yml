name: Publicar PDF do PDC

on:
  push:
    branches: [main]
    paths:
      - 'dados/procedimentos.json'
      - 'scripts/gerar_pdc_pdf.py'
      - '.github/workflows/publicar-pdc-pdf.yml'

permissions:
  contents: write

concurrency:
  group: publicar-pdc-pdf
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar ReportLab
        run: python -m pip install reportlab
      - name: Gerar PDF a partir do PDC completo
        run: python scripts/gerar_pdc_pdf.py
      - name: Publicar PDF no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if git diff --cached --quiet; then
            echo "PDF já está atualizado."
          else
            git commit -m "Publicar PDF atualizado do PDC"
            git pull --rebase origin main
            git push
          fi
