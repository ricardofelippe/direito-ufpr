
name: Associar múltiplos PDFs a material existente

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  associar:
    if: startsWith(github.event.issue.title, '[Associar PDF]')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Associar PDFs ao material
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const issue = context.payload.issue;
            const body = issue.body || '';

            function campo(nome) {
              const escapado = nome.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(
                `### ${escapado}\\s*\\r?\\n([\\s\\S]*?)(?=\\r?\\n### |$)`
              );
              const resultado = body.match(regex);
              return resultado ? resultado[1].trim() : '';
            }

            function slug(texto) {
              return texto
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
            }

            try {
              const titulo = campo('Título do material');
              const disciplina = campo('Disciplina');
              const campoArquivos = campo('Arquivos PDF');

              if (!titulo || !disciplina) {
                throw new Error(
                  'Informe o título e a disciplina do material.'
                );
              }

              const disciplinasPermitidas = [
                'Teoria do Direito',
                'Filosofia do Direito'
              ];

              if (!disciplinasPermitidas.includes(disciplina)) {
                throw new Error('Disciplina inválida.');
              }

              // Localiza todos os anexos PDF
              const anexos = [
                ...campoArquivos.matchAll(
                  /\[([^\]]+\.pdf)\]\((https:\/\/github\.com\/user-attachments\/files\/[^)\s]+)\)/gi
                )
              ];

              if (anexos.length === 0) {
                throw new Error('Nenhum PDF foi anexado.');
              }

              const documentos = JSON.parse(
                fs.readFileSync('documentos.json', 'utf8')
              );

              const encontrados = documentos.filter(doc =>
                doc.titulo === titulo &&
                doc.disciplina === disciplina
              );

              if (encontrados.length !== 1) {
                throw new Error(
                  encontrados.length === 0
                    ? 'Material não encontrado.'
                    : 'Existem materiais duplicados com esse título e disciplina.'
                );
              }

              const doc = encontrados[0];

              // Mantém compatibilidade com os registros antigos
              const arquivosExistentes = [
                ...new Set([
                  ...(Array.isArray(doc.arquivos) ? doc.arquivos : []),
                  doc.arquivo
                ].filter(Boolean))
              ];

              const pasta = `documentos/${slug(disciplina)}`;

              fs.mkdirSync(pasta, { recursive: true });

              const novosArquivos = [];

              for (const anexo of anexos) {
                const nomeOriginal = anexo[1].trim();
                const endereco = anexo[2];

                const url = new URL(endereco);

                if (
                  url.hostname !== 'github.com' ||
                  !url.pathname.startsWith('/user-attachments/files/')
                ) {
                  throw new Error('Endereço de anexo não permitido.');
                }

                if (path.extname(nomeOriginal).toLowerCase() !== '.pdf') {
                  throw new Error(
                    `O arquivo ${nomeOriginal} não é PDF.`
                  );
                }

                const resposta = await fetch(url.toString(), {
                  redirect: 'follow'
                });

                if (!resposta.ok) {
                  throw new Error(
                    `Não foi possível baixar ${nomeOriginal}.`
                  );
                }

                const buffer = Buffer.from(
                  await resposta.arrayBuffer()
                );

                if (buffer.length > 25 * 1024 * 1024) {
                  throw new Error(
                    `${nomeOriginal} ultrapassa 25 MB.`
                  );
                }

                if (buffer.subarray(0, 5).toString() !== '%PDF-') {
                  throw new Error(
                    `${nomeOriginal} não é um PDF válido.`
                  );
                }

                const base = slug(
                  path.basename(
                    nomeOriginal,
                    path.extname(nomeOriginal)
                  )
                ) || 'arquivo';

                let nomeFinal = `${base}.pdf`;
                let contador = 2;

                while (
                  fs.existsSync(path.join(pasta, nomeFinal)) ||
                  arquivosExistentes.includes(`${pasta}/${nomeFinal}`) ||
                  novosArquivos.includes(`${pasta}/${nomeFinal}`)
                ) {
                  nomeFinal = `${base}-${contador}.pdf`;
                  contador++;
                }

                const caminho = `${pasta}/${nomeFinal}`;

                fs.writeFileSync(caminho, buffer);
                novosArquivos.push(caminho);
              }

              // Acrescenta os novos arquivos sem apagar os anteriores
              doc.arquivos = [
                ...new Set([
                  ...arquivosExistentes,
                  ...novosArquivos
                ])
              ];

              // Mantém o primeiro arquivo no campo antigo
              doc.arquivo = doc.arquivos[0];

              fs.writeFileSync(
                'documentos.json',
                JSON.stringify(documentos, null, 2) + '\n'
              );

              execFileSync('git', [
                'config', 'user.name', 'github-actions[bot]'
              ]);

              execFileSync('git', [
                'config', 'user.email',
                '41898282+github-actions[bot]@users.noreply.github.com'
              ]);

              execFileSync('git', [
                'add', 'documentos.json', pasta
              ]);

              execFileSync('git', [
                'commit',
                '-m',
                `Adicionar PDFs ao material: ${titulo}`
              ]);

              execFileSync('git', ['push']);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body:
                  `${novosArquivos.length} PDF(s) associado(s) com sucesso!\n\n` +
                  novosArquivos.map(c => `- \`${c}\``).join('\n') +
                  `\n\nO material agora possui ${doc.arquivos.length} PDF(s).`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });

            } catch (erro) {
              core.setFailed(erro.message);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body:
                  'Não foi possível associar os PDFs: ' +
                  erro.message +
                  '\n\nA Issue permanece aberta para correção.'
              });
            }
