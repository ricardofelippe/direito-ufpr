<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{color-scheme:dark;--bg:#0b1420;--panel:#101d2b;--line:#263b50;--text:#e6edf5;--muted:#9eb0c2;--cyan:#36d9dc}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
    header{padding:28px max(20px,calc((100% - 1080px)/2));background:#0c1420;border-bottom:1px solid var(--line)}
    header small{color:var(--cyan);letter-spacing:.12em;text-transform:uppercase}
    h1{font:700 27px Georgia,serif;margin:8px 0}
    header p{color:var(--muted);margin:0}
    main{max-width:1080px;margin:28px auto;padding:0 20px 48px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
    input{flex:1 1 300px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#101d2b;color:var(--text);font-size:15px}
    button{padding:11px 15px;border:1px solid var(--line);border-radius:6px;background:#152638;color:var(--text);cursor:pointer}
    button:hover{border-color:var(--cyan)}
    #status{color:var(--muted);font-size:13px;margin:12px 0 20px}
    .grupo{margin:22px 0}
    .grupo h2{font-size:17px;color:var(--cyan);font-weight:600;margin:0 0 10px}
    .item{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px 16px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:18px}
    .nome{font-weight:600;overflow-wrap:anywhere}
    .caminho,.data{color:var(--muted);font-size:12px;margin-top:6px}
    a{color:var(--cyan);text-decoration:none;white-space:nowrap}
    a:hover{text-decoration:underline}
    .empty,.error{padding:20px;border:1px solid var(--line);border-radius:7px;color:var(--muted);background:var(--panel)}
    .error{color:#ffc2b8;border-color:#75483f}
    @media(max-width:600px){.item{align-items:flex-start;flex-direction:column}.item a{white-space:normal}header{padding:22px 18px}main{padding:0 16px 36px}}
  </style>
</head>
<body>
  <header>
    <small>Direito UFPR · Acervo pessoal</small>
    <h1>Biblioteca de materiais</h1>
    <p>Consulta privada aos documentos armazenados no Google Drive.</p>
  </header>
  <main>
    <div class="toolbar">
      <input id="busca" type="search" placeholder="Buscar por título, disciplina, unidade ou assunto" autocomplete="off">
      <button type="button" onclick="carregar()">Atualizar catálogo</button>
    </div>
    <div id="status" role="status">Conectando ao Google Drive…</div>
    <section id="resultados" aria-live="polite"></section>
  </main>
  <script>
    let catalogo = [];
    function carregar(){
      document.getElementById('status').textContent='Consultando sua pasta privada no Google Drive…';
      document.getElementById('resultados').innerHTML='';
      google.script.run
        .withSuccessHandler(dados=>{
          catalogo=Array.isArray(dados.materiais)?dados.materiais:[];
          document.getElementById('status').textContent=
            dados.total+' PDF(s) encontrados em “'+dados.pastaRaiz+'”.';
          renderizar();
        })
        .withFailureHandler(erro=>{
          document.getElementById('status').textContent='Não foi possível carregar o catálogo.';
          const box=document.createElement('div');
          box.className='error';
          box.textContent=erro && erro.message ? erro.message : String(erro);
          document.getElementById('resultados').replaceChildren(box);
        })
        .getCatalog();
    }
    function normalizar(v){
      return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    }
    function renderizar(){
      const termo=normalizar(document.getElementById('busca').value);
      const filtrados=catalogo.filter(x=>
        normalizar([x.nome,x.caminho,x.disciplinaPasta,x.unidadePasta,x.assuntoPasta].join(' ')).includes(termo)
      );
      const alvo=document.getElementById('resultados');
      alvo.replaceChildren();
      if(!filtrados.length){
        const vazio=document.createElement('div');
        vazio.className='empty';
        vazio.textContent=catalogo.length?'Nenhum material corresponde à busca.':'Nenhum PDF foi encontrado na pasta configurada.';
        alvo.appendChild(vazio);
        return;
      }
      const grupos=new Map();
      filtrados.forEach(x=>{
        const chave=x.disciplinaPasta||'Materiais na raiz';
        if(!grupos.has(chave)) grupos.set(chave,[]);
        grupos.get(chave).push(x);
      });
      grupos.forEach((itens,nome)=>{
        const sec=document.createElement('section');
        sec.className='grupo';
        const titulo=document.createElement('h2');
        titulo.textContent=nome+' · '+itens.length;
        sec.appendChild(titulo);
        itens.forEach(x=>{
          const card=document.createElement('article');
          card.className='item';
          const info=document.createElement('div');
          const nomeEl=document.createElement('div');
          nomeEl.className='nome';
          nomeEl.textContent=x.nome;
          const caminho=document.createElement('div');
          caminho.className='caminho';
          caminho.textContent=x.caminho;
          const data=document.createElement('div');
          data.className='data';
          data.textContent='Atualizado em '+new Date(x.atualizadoEm).toLocaleDateString('pt-BR');
          info.append(nomeEl,caminho,data);
          const link=document.createElement('a');
          link.href=x.url;
          link.target='_blank';
          link.rel='noopener noreferrer';
          link.textContent='Abrir no Google Drive ↗';
          card.append(info,link);
          sec.appendChild(card);
        });
        alvo.appendChild(sec);
      });
    }
    document.getElementById('busca').addEventListener('input',renderizar);
    carregar();
  </script>
</body>
</html>
