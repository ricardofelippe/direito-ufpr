
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de materiais</title>
  <link rel="stylesheet" href="direito.css">
</head>

<body>
  <header>
    <h1>Cadastro de materiais</h1>
    <p>Adicionar materiais à minha biblioteca de estudos</p>
  </header>

  <main>
    <p><a href="biblioteca.html">← Voltar à biblioteca</a></p>

    <h2>Novo material</h2>

    <form id="form-cadastro">

      <p>
        <label for="disciplina">Disciplina</label><br>
        <select id="disciplina" required>
          <option value="">Carregando disciplinas...</option>
        </select><br>
        <small id="vinculo-disciplina" aria-live="polite">A disciplina selecionada será vinculada ao material.</small>
      </p>

      <p>
        <label for="assunto">Assunto vinculado (opcional)</label><br>
        <select id="assunto" disabled>
          <option value="">Selecione primeiro uma disciplina</option>
        </select><br>
        <small id="vinculo-assunto" aria-live="polite">A lista mostrará os assuntos cadastrados na disciplina escolhida.</small>
      </p>

      <p>
        <label for="titulo">Título do material</label><br>
        <input type="text" id="titulo"
          placeholder="Ex.: Introdução à Teoria do Direito" required>
      </p>

      <p>
        <label for="categoria">Categoria</label><br>
        <select id="categoria" required>
          <option value="">Selecione uma categoria</option>
          <option value="Texto de estudo">Texto de estudo</option>
          <option value="Resumo">Resumo</option>
          <option value="Exercício">Exercício</option>
          <option value="Mapa conceitual">Mapa conceitual</option>
        </select>
      </p>

      <p>
        <label for="descricao">Descrição</label><br>
        <textarea id="descricao"
          placeholder="Descreva brevemente o material..."
          rows="4"></textarea>
      </p>

      <p>
        <label for="arquivo-existente">Selecionar PDF existente</label><br>
        <select id="arquivo-existente">
          <option value="">Carregando PDFs cadastrados...</option>
        </select>
        <small id="status-pdf"></small>
      </p>

      <p>
        <label for="arquivo">Ou informe manualmente o caminho do PDF</label><br>
        <input type="text" id="arquivo"
          placeholder="documentos/teoria-do-direito/arquivo.pdf">
      </p>

      <p>
        <button type="submit">Revisar e enviar no GitHub</button>
      </p>

      <p>
        <button type="button" id="gerar-json">
          Gerar cadastro JSON
        </button>
      </p>

    </form>

    <section id="resultado" hidden>
      <h2>Cadastro gerado</h2>
      <p>Prévia do registro que será cadastrado:</p>
      <textarea id="json-gerado" rows="12" readonly></textarea>
      <p>
        <button type="button" id="copiar">Copiar JSON</button>
      </p>
      <p id="mensagem" role="status"></p>
    </section>
  </main>

  <script>
    const formulario = document.getElementById("form-cadastro");
    const resultado = document.getElementById("resultado");
    const jsonGerado = document.getElementById("json-gerado");
    const mensagem = document.getElementById("mensagem");
    const seletorPDF = document.getElementById("arquivo-existente");
    const statusPDF = document.getElementById("status-pdf");
    const campoArquivo = document.getElementById("arquivo");
    const seletorDisciplina = document.getElementById("disciplina");
    const vinculoDisciplina = document.getElementById("vinculo-disciplina");
    const seletorAssunto = document.getElementById("assunto");
    const vinculoAssunto = document.getElementById("vinculo-assunto");
    let estruturaCurricular = null;

    // Carrega as disciplinas e permite pré-seleção por parâmetro da biblioteca.
    async function carregarDisciplinas() {
      try {
        const resposta = await fetch("./dados/estrutura.json");
        if (!resposta.ok) throw new Error("Não foi possível acessar estrutura.json");

        estruturaCurricular = await resposta.json();
        const disciplinas = (estruturaCurricular.disciplinas || []).slice().sort((a, b) => {
          const anoA = a.ano == null ? 99 : Number(a.ano);
          const anoB = b.ano == null ? 99 : Number(b.ano);
          return anoA - anoB || Number(a.ordem || 9999) - Number(b.ordem || 9999) ||
            String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR");
        });

        seletorDisciplina.replaceChildren(new Option("Selecione uma disciplina", ""));
        const obrigatorias = disciplinas.filter(item => item.categoria === "obrigatoria");
        const outrosSetores = disciplinas.filter(item => item.categoria !== "obrigatoria");

        function adicionarGrupo(rotulo, registros) {
          if (!registros.length) return;
          const grupo = document.createElement("optgroup");
          grupo.label = rotulo;
          registros.forEach(disciplina => {
            const opcao = document.createElement("option");
            opcao.value = disciplina.nome;
            opcao.textContent = (disciplina.codigo ? disciplina.codigo + " — " : "") + disciplina.nome;
            grupo.appendChild(opcao);
          });
          seletorDisciplina.appendChild(grupo);
        }

        adicionarGrupo("Disciplinas obrigatórias", obrigatorias);
        adicionarGrupo("Disciplinas de outros setores", outrosSetores);

        const parametros = new URLSearchParams(window.location.search);
        const disciplinaInicial = parametros.get("disciplina") || "";
        if (disciplinaInicial && disciplinas.some(d => d.nome === disciplinaInicial)) {
          seletorDisciplina.value = disciplinaInicial;
          vinculoDisciplina.textContent = "Material vinculado à disciplina: " + disciplinaInicial;
          atualizarAssuntos(parametros.get("assunto_id") || parametros.get("assunto") || "");
        } else {
          atualizarAssuntos();
        }
        vinculoDisciplina.textContent = disciplinas.length + " disciplinas carregadas da estrutura curricular.";
      } catch (erro) {
        seletorDisciplina.replaceChildren(new Option("Lista de disciplinas indisponível", ""));
        vinculoDisciplina.textContent = "Não foi possível carregar dados/estrutura.json. Atualize a página ou verifique o arquivo.";
      }
    }

    // Exibe somente os assuntos vinculados à disciplina selecionada.
    function atualizarAssuntos(assuntoInicial = "") {
      const nomeDisciplina = seletorDisciplina.value;
      seletorAssunto.replaceChildren(new Option("Material geral da disciplina (sem assunto específico)", ""));

      if (!nomeDisciplina || !estruturaCurricular) {
        seletorAssunto.disabled = true;
        seletorAssunto.replaceChildren(new Option("Selecione primeiro uma disciplina", ""));
        vinculoAssunto.textContent = "A lista mostrará os assuntos cadastrados na disciplina escolhida.";
        return;
      }

      const disciplina = (estruturaCurricular.disciplinas || []).find(d => d.nome === nomeDisciplina);
      if (!disciplina) return;
      const unidades = (estruturaCurricular.unidades || [])
        .filter(u => u.disciplina_id === disciplina.id)
        .sort((a, b) => Number(a.ordem || 9999) - Number(b.ordem || 9999));
      const assuntos = estruturaCurricular.assuntos || [];
      const assuntosDiretosLista = assuntos.filter(a =>
        a.disciplina_id === disciplina.id && !a.unidade_id
      );
      const total = assuntos.filter(a =>
        unidades.some(u => u.id === a.unidade_id) ||
        (a.disciplina_id === disciplina.id && !a.unidade_id)
      ).length;
      let indiceAssunto = 0;

      unidades.forEach((unidade, indiceUnidade) => {
        const relacionados = assuntos
          .filter(a => a.unidade_id === unidade.id)
          .sort((a, b) => Number(a.ordem || 9999) - Number(b.ordem || 9999));
        if (!relacionados.length) return;
        const grupo = document.createElement("optgroup");
        grupo.label = "UNIDADE " + (indiceUnidade + 1) + " — " + unidade.nome;
        relacionados.forEach(assunto => {
          const opcao = document.createElement("option");
          opcao.value = assunto.id;
          indiceAssunto++;
          opcao.textContent = String(indiceAssunto).padStart(2, "0") + "/" + String(total).padStart(2, "0") + " — " + assunto.nome;
          opcao.dataset.nome = assunto.nome;
          grupo.appendChild(opcao);
        });
        seletorAssunto.appendChild(grupo);
      });

      const assuntosDiretos = assuntosDiretosLista
        .sort((a, b) => Number(a.ordem || 9999) - Number(b.ordem || 9999));
      if (assuntosDiretos.length) {
        const grupo = document.createElement("optgroup");
        grupo.label = "Assuntos sem unidade";
        assuntosDiretos.forEach(assunto => {
          const opcao = document.createElement("option");
          opcao.value = assunto.id;
          indiceAssunto++;
          opcao.textContent = String(indiceAssunto).padStart(2, "0") + "/" + String(total).padStart(2, "0") + " — " + assunto.nome;
          opcao.dataset.nome = assunto.nome;
          grupo.appendChild(opcao);
        });
        seletorAssunto.appendChild(grupo);
      }

      seletorAssunto.disabled = false;
      if (assuntoInicial) {
        const opcaoInicial = [...seletorAssunto.options].find(o =>
          o.value === assuntoInicial || o.dataset.nome === assuntoInicial
        );
        if (opcaoInicial) seletorAssunto.value = opcaoInicial.value;
      }
      vinculoAssunto.textContent = total
        ? total + " assunto(s) disponível(is) nesta disciplina."
        : "Ainda não há assuntos cadastrados para esta disciplina.";
    }

    seletorDisciplina.addEventListener("change", function() {
      vinculoDisciplina.textContent = this.value
        ? "Material vinculado à disciplina: " + this.value
        : "A disciplina selecionada será vinculada ao material.";
      atualizarAssuntos();
    });

    seletorAssunto.addEventListener("change", function() {
      const opcao = this.selectedOptions[0];
      vinculoAssunto.textContent = this.value
        ? "Assunto selecionado: " + (opcao.dataset.nome || opcao.textContent)
        : "Material geral da disciplina, sem assunto específico.";
    });

    // Carrega os PDFs já cadastrados no catálogo
    async function carregarPDFs() {
      try {
        const resposta = await fetch("./documentos.json");

        if (!resposta.ok) {
          throw new Error("Não foi possível acessar documentos.json");
        }

        const documentos = await resposta.json();

        const arquivos = [
          ...new Set(
            documentos
              .map(doc => doc.arquivo)
              .filter(arquivo =>
                typeof arquivo === "string" &&
                arquivo.toLowerCase().endsWith(".pdf")
              )
          )
        ];

        seletorPDF.innerHTML =
          '<option value="">Selecione um PDF (opcional)</option>';

        arquivos.forEach(arquivo => {
          const opcao = document.createElement("option");
          opcao.value = arquivo;
          opcao.textContent = arquivo;
          seletorPDF.appendChild(opcao);
        });

        statusPDF.textContent =
          arquivos.length + " PDF(s) encontrado(s).";

      } catch (erro) {
        seletorPDF.innerHTML =
          '<option value="">Lista de PDFs indisponível</option>';

        statusPDF.textContent =
          "Verifique se documentos.json está acessível.";
      }
    }

    // Ao selecionar um PDF, preenche o caminho manual
    seletorPDF.addEventListener("change", function() {
      if (this.value) {
        campoArquivo.value = this.value;
      }
    });

    // Organiza os dados do material
    function obterDocumento() {
      return {
        titulo: document.getElementById("titulo").value.trim(),
        categoria: document.getElementById("categoria").value,
        descricao: document.getElementById("descricao").value.trim(),
        disciplina: document.getElementById("disciplina").value,
        assunto_id: seletorAssunto.value,
        assunto: seletorAssunto.value ? (seletorAssunto.selectedOptions[0].dataset.nome || seletorAssunto.selectedOptions[0].textContent) : "",
        arquivo: campoArquivo.value.trim()
      };
    }

    // Valida o caminho do PDF
    function validarArquivo(arquivo) {
      if (!arquivo) return true;

      if (
        !arquivo.startsWith("documentos/") ||
        !arquivo.toLowerCase().endsWith(".pdf")
      ) {
        alert(
          "Informe um caminho válido, iniciado por documentos/ e terminado em .pdf."
        );
        return false;
      }

      return true;
    }

    // Gera uma prévia do JSON
    document.getElementById("gerar-json")
      .addEventListener("click", function() {

        if (!formulario.reportValidity()) return;

        const documento = obterDocumento();

        if (!validarArquivo(documento.arquivo)) return;

        jsonGerado.value = JSON.stringify(documento, null, 2);
        resultado.hidden = false;
        mensagem.textContent = "";

        resultado.scrollIntoView({
          behavior: "smooth"
        });
      });

    // Abre o formulário do GitHub com os campos preenchidos
    formulario.addEventListener("submit", function(event) {
      event.preventDefault();

      if (!formulario.reportValidity()) return;

      const documento = obterDocumento();

      if (!validarArquivo(documento.arquivo)) return;

      const parametros = new URLSearchParams();

      parametros.set(
        "template",
        "cadastrar-material.yml"
      );

      parametros.set(
        "title",
        "[Cadastro de material] " + documento.titulo
      );

      parametros.set("titulo", documento.titulo);
      parametros.set("disciplina", documento.disciplina);
      parametros.set("assunto", documento.assunto);
      parametros.set("categoria", documento.categoria);
      parametros.set("descricao", documento.descricao);
      parametros.set("arquivo", documento.arquivo);

      const endereco =
        "https://github.com/ricardofelippe/direito-ufpr/issues/new?"
        + parametros.toString();

      window.location.href = endereco;
    });

    // Copia o JSON
    document.getElementById("copiar")
      .addEventListener("click", async function() {
        try {
          await navigator.clipboard.writeText(jsonGerado.value);
          mensagem.textContent = "JSON copiado com sucesso!";
        } catch (erro) {
          jsonGerado.select();
          mensagem.textContent =
            "Selecione e copie o conteúdo manualmente.";
        }
      });

    carregarDisciplinas();
    carregarPDFs();
  </script>
</body>
</html>
