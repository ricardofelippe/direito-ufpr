name: Importar cronograma previsto

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: importar-cronograma-oferta
  cancel-in-progress: false

jobs:
  importar:
    if: github.event.issue.user.login == 'ricardofelippe' && startsWith(github.event.issue.title, '[Importar cronograma]')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar e salvar cronograma
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const issue = context.payload.issue;
            const body = (issue.body || '').replace(/\r/g, '');

            function campo(nome) {
              const marcador = '### ' + nome + '\n';
              const inicio = body.indexOf(marcador);
              if (inicio < 0) throw new Error('Campo ausente: ' + nome);
              const restante = body.slice(inicio + marcador.length);
              const fim = restante.indexOf('\n### ');
              return (fim < 0 ? restante : restante.slice(0, fim)).trim();
            }

            try {
              const ofertaId = campo('Oferta');
              const jsonCampo = campo('JSON do cronograma');
              const bloco = jsonCampo.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
              if (!bloco) throw new Error('Não foi encontrado um bloco JSON válido na solicitação.');

              const dados = JSON.parse(bloco[1]);
              if (!dados || typeof dados !== 'object' || Array.isArray(dados)) {
                throw new Error('O JSON precisa conter um objeto.');
              }
              if (!['atividades_encontradas', 'nenhuma_atividade_identificada'].includes(dados.status_extracao)) {
                throw new Error('status_extracao não permitido para gravação.');
              }
              if (!Array.isArray(dados.atividades) || dados.atividades.length > 100) {
                throw new Error('A lista atividades é inválida ou ultrapassa 100 registros.');
              }
              if (dados.status_extracao === 'atividades_encontradas' && dados.atividades.length === 0) {
                throw new Error('O status indica atividades encontradas, mas a lista está vazia.');
              }
              if (dados.status_extracao === 'nenhuma_atividade_identificada' && dados.atividades.length !== 0) {
                throw new Error('A lista deve estar vazia quando nenhuma atividade foi identificada.');
              }

              const tipos = ['prova', 'trabalho', 'seminario', 'entrega', 'outro'];
              const atividades = dados.atividades.map((atividade, indice) => {
                if (!atividade || typeof atividade !== 'object' || Array.isArray(atividade)) {
                  throw new Error('Atividade ' + (indice + 1) + ' inválida.');
                }
                if (!tipos.includes(atividade.tipo)) {
                  throw new Error('Tipo inválido na atividade ' + (indice + 1) + '.');
                }
                const titulo = String(atividade.titulo || '').trim();
                if (!titulo || titulo.length > 300) {
                  throw new Error('Título ausente ou muito longo na atividade ' + (indice + 1) + '.');
                }
                let data = atividade.data;
                if (data !== null) {
                  if (typeof data !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(data)) {
                    throw new Error('Data inválida na atividade ' + (indice + 1) + '. Use AAAA-MM-DD ou null.');
                  }
                  const dt = new Date(data + 'T00:00:00Z');
                  if (Number.isNaN(dt.getTime()) || dt.toISOString().slice(0, 10) !== data) {
                    throw new Error('Data inexistente na atividade ' + (indice + 1) + '.');
                  }
                }
                return {
                  tipo: atividade.tipo,
                  titulo,
                  data,
                  observacao: String(atividade.observacao || '').trim()
                };
              });

              const ofertasPath = 'dados/ofertas.json';
              const arquivo = JSON.parse(fs.readFileSync(ofertasPath, 'utf8'));
              if (!Array.isArray(arquivo.ofertas)) throw new Error('Formato inválido em dados/ofertas.json.');
              const correspondentes = arquivo.ofertas.filter(item => item.id === ofertaId);
              if (correspondentes.length !== 1) throw new Error('Oferta não encontrada ou duplicada: ' + ofertaId);
              const oferta = correspondentes[0];

              if (String(dados.disciplina || '').trim().toLowerCase() !== String(oferta.disciplina || '').trim().toLowerCase()) {
                throw new Error('A disciplina do JSON não corresponde à oferta.');
              }
              if (dados.periodo !== oferta.periodo) {
                throw new Error('O período do JSON não corresponde à oferta.');
              }

              oferta.cronograma_previsto = atividades;
              oferta.status_extracao = dados.status_extracao;
              oferta.observacoes_gerais = String(dados.observacoes_gerais || '').trim();
              oferta.cronograma_atualizado_em = new Date().toISOString();

              fs.writeFileSync(ofertasPath, JSON.stringify(arquivo, null, 2) + '\n', 'utf8');
              execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
              execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
              execFileSync('git', ['add', ofertasPath]);
              const alteracoes = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' }).trim();
              if (alteracoes) {
                execFileSync('git', ['commit', '-m', 'Importar cronograma: ' + oferta.disciplina + ' ' + oferta.periodo]);
                // Sincroniza commits publicados por outros workflows antes de enviar.
                execFileSync('git', ['pull', '--rebase', 'origin', 'main']);
                execFileSync('git', ['push', 'origin', 'HEAD:main']);
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Cronograma validado e salvo para **' + oferta.disciplina + ' — ' + oferta.periodo + '**. Atividades gravadas: ' + atividades.length + '. ' +
                  (atividades.length ? 'O cartão da disciplina será atualizado após a publicação do GitHub Pages.' : 'A oferta foi registrada sem atividades identificadas.')
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            } catch (error) {
              core.setFailed(error.message);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Não foi possível importar o cronograma: **' + error.message + '**. Nenhuma atualização foi publicada; revise a solicitação e tente novamente.'
              });
            }
